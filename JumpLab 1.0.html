<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="JumpLab 1.0: altura y potencia de salto (SJ, CMJ, Abalakov, Drop Jump, saltos repetidos) a partir de vídeo, con base de datos, gráficos e informes.">
<title>JumpLab 1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap">
<style>
:root{
  /* Layout: barra lateral fija + área de trabajo; el análisis de vídeo es una rejilla escenario | panel de medición. */
  --bg:#edf1f4; --surface:#ffffff; --surface-2:#f5f7f9; --surface-3:#e9eef2;
  --ink:#0f1a24; --ink-2:#46525e; --muted:#6f7b86;
  --line:#dce2e8; --line-strong:#c2cbd4;
  --accent:#0a6b70; --accent-hover:#085a5e; --accent-ink:#ffffff; --accent-soft:#dcefef;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --warn-text:#8a5a00; --serious:#ec835a; --crit:#d03b3b; --crit-text:#b12f2f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --grid:#e7eaed; --axis:#c3c2b7; --chart-surface:#ffffff; --band:rgba(15,26,36,.06);
  --shadow:0 1px 2px rgba(15,26,36,.06), 0 6px 18px rgba(15,26,36,.05);
  --radius:10px;
  --font-display:'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b1015; --surface:#141a21; --surface-2:#1a2129; --surface-3:#222b34; --ink:#e8edf1; --ink-2:#aab5bf; --muted:#8a95a0; --line:#26303a; --line-strong:#36424e;
    --accent:#38bfc2; --accent-hover:#5fd0d2; --accent-ink:#052426; --accent-soft:#12373a; --good-text:#3ccf3c; --warn-text:#fab219; --crit-text:#ff8a8a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --grid:#222a32; --axis:#3a444e; --chart-surface:#141a21; --band:rgba(232,237,241,.07); --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#0b1015; --surface:#141a21; --surface-2:#1a2129; --surface-3:#222b34; --ink:#e8edf1; --ink-2:#aab5bf; --muted:#8a95a0; --line:#26303a; --line-strong:#36424e;
    --accent:#38bfc2; --accent-hover:#5fd0d2; --accent-ink:#052426; --accent-soft:#12373a; --good-text:#3ccf3c; --warn-text:#fab219; --crit-text:#ff8a8a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --grid:#222a32; --axis:#3a444e; --chart-surface:#141a21; --band:rgba(232,237,241,.07); --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:14.5px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hidden{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:228px 1fr;grid-template-rows:56px 1fr;min-height:100%}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand svg{width:30px;height:30px}
.brand .ver{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 7px;letter-spacing:0}
.topbar .spacer{flex:1}
.store-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.store-pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.store-pill.ok i{background:var(--good)} .store-pill.warn i{background:var(--warn)} .store-pill.bad i{background:var(--crit)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px}
.side-in{position:sticky;top:70px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.side .foot{margin-top:18px;padding:12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
main{padding:22px clamp(16px,2.4vw,30px) 60px;min-width:0}
.view{display:flex;flex-direction:column;gap:18px;max-width:1360px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.view-head p{color:var(--ink-2);margin-top:4px;max-width:70ch}

/* ---------- Componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card > h2,.card > h3,.card-head{margin-bottom:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head h2,.card-head h3{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--surface-2);border-color:var(--ink-2)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--crit-text);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,var(--crit) 10%,var(--surface))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.chip .k{width:10px;height:3px;border-radius:2px;display:inline-block}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.good{background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good-text)}
.chip.warn{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--warn-text)}
.chip.crit{background:color-mix(in srgb,var(--crit) 13%,var(--surface));color:var(--crit-text)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--radius);border:1px solid color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.banner.info{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--accent-soft)}
.banner p{flex:1;min-width:240px}
kbd{font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface-2)}

/* Formularios */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label,.field > .lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.hint{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=search],select,textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);min-height:36px}
textarea{min-height:90px;resize:vertical;font-family:var(--font-mono);font-size:12.5px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:0;border-color:var(--accent)}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.field.err input,.field.err select{border-color:var(--crit)}
.form-error{color:var(--crit-text);font-size:12.5px;font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .field{min-width:150px;flex:0 1 190px;max-width:100%}
.filters > *{max-width:100%}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* Tablas */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t th.sortable{cursor:pointer;user-select:none}
.t th.sortable:hover{color:var(--ink)}
.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.t td.n,.t th.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.t tr.invalid td{color:var(--muted);text-decoration:line-through}
.t tr.invalid td.act{text-decoration:none}
.t td.act{white-space:nowrap;text-align:right}
.t .name{font-weight:600}
.empty{padding:26px;text-align:center;color:var(--muted)}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding-top:10px;font-size:13px;color:var(--ink-2)}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .lbl{font-size:12px;color:var(--ink-2);font-weight:600}
.tile .val{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.tile .val small{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.tile .sub{font-size:12px;color:var(--muted)}
.tile.hero .val{font-size:44px}

/* ---------- Análisis de vídeo ---------- */
.va{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.stage-row{display:flex;gap:14px;align-items:flex-start}
.stage{position:relative;flex:none;background:#0a0e12;border-radius:var(--radius);overflow:hidden;aspect-ratio:var(--arn,1.6);width:min(100%, calc(var(--maxh,70vh) * var(--arn,1.6)));margin-inline:auto;touch-action:none}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#000}
.stage-side{display:none;flex-direction:column;gap:14px;flex:1;min-width:240px}
.va.portrait .stage{--maxh:80vh;margin-inline:0}
.va.portrait .stage-side{display:flex}
.va.portrait .lens-row{display:none}
.stage-side .lens{width:100%;max-width:320px;height:auto;aspect-ratio:1}
.stage .xbtn{position:absolute;right:10px;bottom:10px;display:none;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(5,10,14,.72);color:#eaf2f6;cursor:pointer;z-index:3}
.stage .xbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stage.loaded .xbtn{display:grid}
.stage .lens2{display:none;position:absolute;right:12px;top:50%;transform:translateY(-50%);width:min(30vw,240px);height:min(30vw,240px);border-radius:10px;border:1px solid rgba(255,255,255,.35);image-rendering:pixelated;z-index:2;pointer-events:none}
.stage .fsbar{display:none;position:absolute;left:10px;right:10px;top:10px;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;z-index:3;pointer-events:none}
.stage .fsbar > *{pointer-events:auto}
.stage .fsbar button{border:1px solid rgba(255,255,255,.25);background:rgba(5,10,14,.8);color:#eaf2f6;border-radius:9px;padding:9px 13px;font-weight:600;font-size:14px;cursor:pointer;min-width:44px}
.stage .fsbar button.mk{border-color:rgba(56,191,194,.7)}
.stage .fsbar .fsread{background:rgba(5,10,14,.8);color:#eaf2f6;font-family:var(--font-mono);font-size:13px;padding:9px 12px;border-radius:9px}
.stage.expanded{position:fixed;inset:0;z-index:150;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;margin:0}
.stage.expanded .fsbar{display:flex}
.stage.expanded .lens2{display:block}
.stage.expanded .xbtn,.stage.expanded .hud{display:none}
.stage canvas.overlay{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.stage .drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#dfe6ec;text-align:center;padding:24px;border:2px dashed rgba(255,255,255,.18);border-radius:var(--radius);margin:12px}
.stage .drop svg{width:44px;height:44px;stroke:#8fd6d8;fill:none;stroke-width:1.6}
.stage .drop p{max-width:52ch;color:#b8c3cc;font-size:13px}
.stage.dragover .drop{border-color:#8fd6d8;background:rgba(56,191,194,.08)}
.stage .hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.stage .hud span{background:rgba(5,10,14,.72);color:#eaf2f6;font-family:var(--font-mono);font-size:12px;padding:3px 8px;border-radius:6px}
.stage .hud span.ev{color:#fff}
.transport{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.transport .btn{padding:7px 10px}
.frame-read{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);margin-left:auto;text-align:right}
.frame-read b{color:var(--ink);font-weight:500}
.timeline{position:relative;height:22px;margin-top:2px}
.timeline .tick{position:absolute;top:2px;width:3px;height:18px;border-radius:2px;transform:translateX(-1px);cursor:pointer;border:0;padding:0}
.timeline .win{position:absolute;top:8px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--accent) 28%,transparent)}
.lens-row{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start}
.lens{width:220px;height:220px;border-radius:9px;background:#0a0e12;border:1px solid var(--line);image-rendering:pixelated;display:block}
.ev-list{display:flex;flex-direction:column;gap:8px}
.ev-row{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.ev-row .k{width:12px;height:12px;border-radius:3px}
.ev-row .nm{font-weight:600;font-size:13px}
.ev-row .fr{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.ev-row.set{background:var(--surface);border-color:var(--line-strong)}
.ev-row .acts{display:flex;gap:4px}
.result-big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.result-big .v{font-family:var(--font-display);font-weight:800;font-size:46px;letter-spacing:-.03em;line-height:1}
.result-big .u{font-size:16px;color:var(--ink-2);font-weight:600}
.result-big .pm{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:12px}
.kv div{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:6px}
.kv span{font-size:11.5px;color:var(--muted);font-weight:600}
.kv b{font-family:var(--font-mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.warns{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.warns div{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:7px 10px;border-radius:8px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--ink)}
.warns div::before{content:"!";flex:none;display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--warn);color:#0b0b0b;font-weight:800;font-size:11px;margin-top:1px}
.warns div.crit{background:color-mix(in srgb,var(--crit) 12%,var(--surface))}
.warns div.crit::before{background:var(--crit);color:#fff}
.progress{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}

/* ---------- Gráficos ---------- */
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;width:100%;overflow:visible}
.chart svg:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;min-width:140px;z-index:5;display:none}
.chart .tip .d{color:var(--muted);font-size:11.5px;margin-bottom:4px}
.chart .tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.chart .tip .r b{font-family:var(--font-mono);font-weight:600;color:var(--ink)}
.chart .tip .r span{color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chart .tip .r i{width:12px;height:2px;border-radius:1px;display:inline-block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.legend i.sq{width:11px;height:11px;border-radius:3px}
.chart-empty{display:grid;place-items:center;min-height:200px;color:var(--muted);text-align:center;padding:20px;border:1px dashed var(--line-strong);border-radius:9px}

/* ---------- Modal / toast ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(8,14,20,.48);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{width:min(900px,100%)}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .modal-body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:120;max-width:min(420px,calc(100% - 32px))}
.toast{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px}
.toast.err{background:var(--crit);color:#fff}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 9px;font-weight:700;cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.thumbs figure{margin:0;display:flex;flex-direction:column;gap:4px}
.thumbs img{width:100%;border-radius:8px;border:1px solid var(--line);background:#000}
.thumbs figcaption{font-size:12px;color:var(--ink-2)}
.loading{display:flex;align-items:center;gap:10px;color:var(--ink-2);padding:30px}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line-strong);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Texto de protocolo */
.doc{max-width:78ch}
.doc h3{margin:18px 0 6px}
.doc p,.doc li{color:var(--ink-2)}
.doc ul{padding-left:20px;margin:6px 0}
.doc li{margin:3px 0}
.formula{font-family:var(--font-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;color:var(--ink);overflow-x:auto;white-space:nowrap}
.refs li{font-size:12.5px}

/* Informe */
.report-preview{background:#fff;color:#111;border-radius:var(--radius);border:1px solid var(--line);padding:0;overflow:hidden}
#print-area{display:none}

@media (max-width: 1100px){ .va{grid-template-columns:1fr} .g-side{grid-template-columns:1fr} }
@media (max-width: 860px){
  .stage-row{flex-direction:column}
  .stage,.va.portrait .stage{--maxh:72vh;margin-inline:auto}
  .stage-side{width:100%;min-width:0}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px auto 1fr}
  .side{position:sticky;top:56px;height:auto;z-index:25;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .side-in{position:static}
  .nav{flex-direction:row;gap:2px}
  .nav a{padding:7px 10px;white-space:nowrap;font-size:13px}
  .nav .sep,.side .foot{display:none}
  .g2,.g3{grid-template-columns:1fr}
  .lens-row{grid-template-columns:1fr}
  .lens{width:100%;max-width:260px;height:auto;aspect-ratio:1}
  .store-pill .txt{display:none}
}
@media (max-width: 480px){ .topbar{padding:0 12px} .brand .ver{display:none} .tile.hero .val{font-size:36px} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }
@media print{
  body{background:#fff}
  .app{display:none !important}
  .toasts,.modal-wrap{display:none !important}
  #print-area{display:block !important}
}

.force-light{
  
  --bg:#edf1f4; --surface:#ffffff; --surface-2:#f5f7f9; --surface-3:#e9eef2;
  --ink:#0f1a24; --ink-2:#46525e; --muted:#6f7b86;
  --line:#dce2e8; --line-strong:#c2cbd4;
  --accent:#0a6b70; --accent-hover:#085a5e; --accent-ink:#ffffff; --accent-soft:#dcefef;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --warn-text:#8a5a00; --serious:#ec835a; --crit:#d03b3b; --crit-text:#b12f2f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --grid:#e7eaed; --axis:#c3c2b7; --chart-surface:#ffffff; --band:rgba(15,26,36,.06);
  --shadow:0 1px 2px rgba(15,26,36,.06), 0 6px 18px rgba(15,26,36,.05);
  --radius:10px;
  --font-display:'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:light;
 color:var(--ink);}

</style>
</head>

/** Número formateado en español; '—' si no hay valor. */
function fmt(v, d = 1) { return (v == null || !isFinite(v)) ? '—' : nf(d).format(v); }

/* ---------- Estadística básica ---------- */
function sum(a) { let s = 0; for (const x of a) s += x; return s; }
function mean(a) { return a.length ? sum(a) / a.length : null; }
function sd(a) { if (a.length < 2) return null; const m = mean(a); return Math.sqrt(sum(a.map(x => (x - m) ** 2)) / (a.length - 1)); }
function cvPct(a) { const m = mean(a), s = sd(a); return (m && s != null) ? s / m * 100 : null; }

function linReg(xs, ys) {
  const n = xs.length; if (n < 2) return null;
  const mx = mean(xs), my = mean(ys);
  let sxx = 0, sxy = 0, syy = 0;
  for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxx += dx * dx; sxy += dx * dy; syy += dy * dy; }
  if (sxx === 0) return null;
  const b = sxy / sxx, a = my - b * mx;
  const r2 = (syy === 0) ? 1 : (sxy * sxy) / (sxx * syy);
  return { a, b, r2 };

/* ---------- Fechas (siempre locales, ISO AAAA-MM-DD) ---------- */
function pad2(n) { return String(n).padStart(2, '0'); }

function nowHM() { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function isoToMs(iso) { if (!iso) return NaN; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).getTime(); }
function fmtDate(iso) { if (!iso) return '—'; const p = iso.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso; }
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function fmtDateShort(ms) { const d = new Date(ms); return d.getDate() + ' ' + MESES[d.getMonth()]; }
function ageAt(birthISO, atISO) {
  if (!birthISO) return null;
  const b = new Date(isoToMs(birthISO)), a = atISO ? new Date(isoToMs(atISO)) : new Date();

function parseDateAny(s) {

function toast(msg, opts = {}) {

/**
 * Diálogo modal propio (los diálogos nativos no funcionan dentro del visor).
 * onAction(value, root) puede devolver false para mantenerlo abierto, u otro valor para resolver con él.
 */
function openModal({ title, body = '', actions = [{ label: 'Cerrar', value: null }], wide = false, dismissable = true, onMount, onAction }) {
  return new Promise(resolve => {
    const root = document.getElementById('modal-root');
    const prev = document.activeElement;
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="mdl-title">
      <header><h2 id="mdl-title"></h2><button type="button" class="icon-btn" data-x aria-label="Cerrar">${ICON.x}</button></header>
      <div class="modal-body">${body}</div>
      <footer>${actions.map((a, i) => `<button type="button" class="btn ${a.kind || ''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</footer></div>`;
    wrap.querySelector('#mdl-title').textContent = title;
    let closed = false;
    const close = v => { if (closed) return; closed = true; wrap.remove(); document.removeEventListener('keydown', onKey, true); try { prev && prev.focus && prev.focus(); } catch (e) { } resolve(v); };
    const onKey = e => {
      if (e.key === 'Escape') { e.stopPropagation(); close(null); }
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON') {
        const primary = actions.findIndex(a => a.kind && a.kind.includes('primary'));
        if (primary >= 0) { e.preventDefault(); wrap.querySelector(`footer [data-i="${primary}"]`).click(); }
      }
      e.stopPropagation();
    };
    document.addEventListener('keydown', onKey, true);
    wrap.addEventListener('click', async e => {
      if ((e.target === wrap && dismissable) || e.target.closest('[data-x]')) return close(null);
      const b = e.target.closest('footer [data-i]'); if (!b) return;
      const a = actions[+b.dataset.i];

        if (r === false) return;
        close(r === undefined ? a.value : r);

    if (onMount) onMount(wrap);

/* ============================================================
   JumpLab 1.0 · motor de cálculo
   Altura por tiempo de vuelo: h = g·tv²/8 (Bosco et al., 1983)
   ============================================================ */

/** Catálogo de pruebas. `color` es el índice fijo de la serie (el color sigue a la prueba). */
const TESTS = {
  SJ: { id: 'SJ', corto: 'SJ', nombre: 'Squat Jump', ev: ['despegue', 'aterrizaje'], opt: [], carga: true, reg: true, color: 1,
    desc: 'Salto desde 90° de flexión de rodilla mantenida 2–3 s, sin contramovimiento, manos en la cintura.' },
  CMJ: { id: 'CMJ', corto: 'CMJ', nombre: 'Countermovement Jump', ev: ['despegue', 'aterrizaje'], opt: ['inicio'], carga: true, reg: true, color: 2,
    desc: 'Salto con contramovimiento libre, manos en la cintura.' },
  ABK: { id: 'ABK', corto: 'ABK', nombre: 'Abalakov (CMJ con brazos)', ev: ['despegue', 'aterrizaje'], opt: ['inicio'], carga: false, reg: true, color: 3,
    desc: 'CMJ con impulso libre de brazos.' },
  CMJ_I: { id: 'CMJ_I', corto: 'CMJ-I', nombre: 'CMJ unipodal izquierda', ev: ['despegue', 'aterrizaje'], opt: ['inicio'], carga: false, reg: false, uni: 'I', color: 4,
    desc: 'CMJ sobre la pierna izquierda, manos en la cintura.' },
  CMJ_D: { id: 'CMJ_D', corto: 'CMJ-D', nombre: 'CMJ unipodal derecha', ev: ['despegue', 'aterrizaje'], opt: ['inicio'], carga: false, reg: false, uni: 'D', color: 5,
    desc: 'CMJ sobre la pierna derecha, manos en la cintura.' },
  DJ: { id: 'DJ', corto: 'DJ', nombre: 'Drop Jump', ev: ['contacto', 'despegue', 'aterrizaje'], opt: [], caida: true, color: 7,
    desc: 'Caída desde un cajón y rebote inmediato con contacto mínimo, manos en la cintura.' },
  RJ: { id: 'RJ', corto: 'RJ', nombre: 'Saltos repetidos (RJ)', ev: [], opt: [], seq: true, color: 6,
    desc: 'Saltos continuos máximos con contactos breves (p. ej., test de Bosco de 15 s).' },
};
const TEST_ORDER = ['SJ', 'CMJ', 'ABK', 'CMJ_I', 'CMJ_D', 'DJ', 'RJ'];
const EVENTS = {
  inicio: { nombre: 'Inicio del movimiento', key: 'I', color: 3, ayuda: 'Primer fotograma con descenso visible (opcional, para RSImod).' },
  contacto: { nombre: 'Contacto inicial', key: 'C', color: 7, ayuda: 'Primer fotograma en que un pie toca el suelo tras la caída.' },
  despegue: { nombre: 'Despegue', key: 'D', color: 1, ayuda: 'Primer fotograma con ambos pies en el aire.' },
  aterrizaje: { nombre: 'Aterrizaje', key: 'A', color: 2, ayuda: 'Primer fotograma con al menos un pie en contacto.' },
};
const POWER_FORMULAS = {
  sayers: { nombre: 'Sayers et al. (1999) · potencia pico', corto: 'Sayers (pico)' },
  harmanPico: { nombre: 'Harman et al. (1991) · potencia pico', corto: 'Harman (pico)' },
  harmanMedia: { nombre: 'Harman et al. (1991) · potencia media', corto: 'Harman (media)' },
  samozino: { nombre: 'Samozino et al. (2008) · potencia media (requiere hpo)', corto: 'Samozino (media)' },
  lewis: { nombre: 'Lewis (Fox y Mathews, 1974) · potencia media', corto: 'Lewis (media)' },
};
const METRICS = {
  h: { nombre: 'Altura de salto', unidad: 'cm', dec: 1, get: r => r.h != null ? r.h * 100 : null },
  tf: { nombre: 'Tiempo de vuelo', unidad: 'ms', dec: 0, get: r => r.tf != null ? r.tf * 1000 : null },
  pW: { nombre: 'Potencia', unidad: 'W', dec: 0, get: r => r.pW },
  pWkg: { nombre: 'Potencia relativa', unidad: 'W/kg', dec: 1, get: r => r.pWkg },
  v0: { nombre: 'Velocidad de despegue', unidad: 'm/s', dec: 2, get: r => r.v0 },
  rsi: { nombre: 'RSI', unidad: 'm/s', dec: 2, get: r => r.rsi },
  tc: { nombre: 'Tiempo de contacto', unidad: 'ms', dec: 0, get: r => r.tc != null ? r.tc * 1000 : null },
  rsimod: { nombre: 'RSImod', unidad: 'm/s', dec: 2, get: r => r.rsimod },
};
const SETTINGS_DEFAULT = {
  g: 9.81, potencia: 'sayers', agregacion: 'mejor', csv: 'eu', miniaturas: true, cvAviso: 5,
  tema: 'auto', evaluador: '', centro: '', cambioAviso: 5,
};

function hFromTf(tf, g) { return g * tf * tf / 8; }
function tfFromH(h, g) { return Math.sqrt(8 * h / g); }

/** Distancia de impulso (m): longitud de pierna extendida − altura en posición inicial, o valor directo. */
function hpoOf(ath) {
  if (!ath) return null;
  if (ath.hpoCm > 0) return ath.hpoCm / 100;
  if (ath.piernaCm > 0 && ath.sentadillaCm > 0 && ath.piernaCm > ath.sentadillaCm) return (ath.piernaCm - ath.sentadillaCm) / 100;
  return null;
}

/**
 * Potencias estimadas. Las ecuaciones de regresión (Sayers, Harman, Lewis) solo se aplican a saltos sin carga.
 * Samozino usa la masa del sistema (corporal + carga) y la distancia de impulso hpo.
 */
function computePowers(hM, mass, load, hpo, g) {
  const out = {};
  if (!(mass > 0) || !(hM > 0)) return out;
  const hcm = hM * 100;
  if (!(load > 0)) {
    out.sayers = 60.7 * hcm + 45.3 * mass - 2055;
    out.harmanPico = 61.9 * hcm + 36.0 * mass - 1822;
    out.harmanMedia = 21.2 * hcm + 23.0 * mass - 1393;
    out.lewis = Math.sqrt(4.9) * mass * Math.sqrt(hM) * 9.81;
  }
  if (hpo > 0) {
    const M = mass + (load > 0 ? load : 0);
    const F = M * g * (hM / hpo + 1);
    const v = Math.sqrt(g * hM / 2);
    out.samozino = F * v; out.F = F; out.v = v; out.Frel = F / mass;
  }
  return out;
}

/** Calcula todas las variables de un intento. No modifica el intento. */
function computeTrial(t, ath, S) {
  S = S || SETTINGS_DEFAULT;
  const g = S.g > 9 && S.g < 10.5 ? S.g : 9.81;
  const T = TESTS[t.prueba] || TESTS.CMJ;
  const r = { ok: false, warn: [] };
  const mass = t.masa > 0 ? t.masa : (ath && ath.masa > 0 ? ath.masa : null);
  r.masa = mass;
  if (T.seq) {
    const tf = ((t.rj && t.rj.tf) || []).filter(x => x > 0);
    const tc = (t.rj && t.rj.tc) || [];
    if (!tf.length) return r;
    const hs = tf.map(x => hFromTf(x, g));
    r.n = tf.length; r.hList = hs; r.h = mean(hs); r.hMax = Math.max(...hs); r.tf = mean(tf); r.v0 = g * r.tf / 2;
    const cyc = [];
    for (let i = 1; i < tf.length; i++) { const c = tc[i - 1]; if (c > 0) cyc.push({ tf: tf[i], tc: c, h: hs[i] }); }
    if (cyc.length) {
      const Tf = sum(cyc.map(c => c.tf)), Tc = sum(cyc.map(c => c.tc));
      r.ciclos = cyc.length; r.tc = Tc / cyc.length; r.rsi = mean(cyc.map(c => c.h / c.tc));
      r.boscoWkg = g * g * Tf * (Tf + Tc) / (4 * cyc.length * Tc);
      if (mass) r.boscoW = r.boscoWkg * mass;
      r.duracion = Tf + Tc;
    }
    if (hs.length >= 6) { const a = mean(hs.slice(0, 3)), b = mean(hs.slice(-3)); r.decremento = (a - b) / a * 100; }
    r.pWkg = r.boscoWkg ?? null; r.pW = r.boscoW ?? null; r.potFormula = r.pWkg != null ? 'bosco' : null;
    r.ok = true;
    if (tf.some(x => x > 1)) r.warn.push('Algún tiempo de vuelo supera 1 s: ¿vídeo ralentizado? Revisa los fps de captura.');
    return r;
  }
  const tf = t.tv;
  if (!(tf > 0)) return r;
  r.tf = tf; r.h = hFromTf(tf, g); r.v0 = g * tf / 2;
  if (T.id === 'DJ') {
    if (t.tc > 0) {
      r.tc = t.tc; r.rsi = r.h / t.tc; r.tfTc = tf / t.tc;
      r.boscoWkg = g * g * tf * (tf + t.tc) / (4 * t.tc);
      if (mass) r.boscoW = r.boscoWkg * mass;
      if (t.tc < 0.08 || t.tc > 0.8) r.warn.push('Tiempo de contacto fuera del rango habitual (80–800 ms).');
    }
    r.pWkg = r.boscoWkg ?? null; r.pW = r.boscoW ?? null; r.potFormula = r.pWkg != null ? 'bosco' : null;
  } else {
    const hpo = hpoOf(ath);
    const P = computePowers(r.h, mass, t.carga, hpo, g);
    r.pot = P; r.F = P.F ?? null; r.vMedia = P.v ?? null; r.Frel = P.Frel ?? null;
    if (T.reg) {
      let f = S.potencia || 'sayers';
      if (t.carga > 0) f = 'samozino';
      if (P[f] == null && f === 'samozino' && !(t.carga > 0)) { f = 'sayers'; r.potNota = 'Sin hpo registrado: se usa Sayers.'; }
      r.potFormula = P[f] != null ? f : null;
      r.pW = P[f] ?? null;
      if (t.carga > 0 && r.pW == null) r.warn.push('Salto con carga: registra la distancia de impulso (hpo) del deportista para calcular la potencia (Samozino).');
    }
    if (r.pW != null && mass) r.pWkg = r.pW / mass;
    if (t.ttt > 0) { r.ttt = t.ttt; r.rsimod = r.h / t.ttt; }
  }
  if (tf > 1.0) r.warn.push('Tiempo de vuelo superior a 1 s: ¿vídeo ralentizado? Revisa los fps de captura.');
  else if (tf < 0.15) r.warn.push('Tiempo de vuelo muy corto (< 150 ms): revisa los fotogramas marcados.');
  r.ok = true;
  return r;
}

/** ±1 fotograma de incertidumbre en el tiempo de vuelo → rango de altura (m). */
function heightRange(tf, frameDur, g) {
  if (!(tf > 0) || !(frameDur > 0)) return null;
  return { lo: hFromTf(Math.max(0, tf - frameDur), g), hi: hFromTf(tf + frameDur, g) };
}

/* ---------- Sesiones: deportista + fecha + prueba (+ carga / altura de caída) ---------- */
function sessionKey(t) { return [t.atletaId, t.fecha, t.prueba, +(t.carga || 0), +(t.caida || 0)].join('|'); }
function primaryValue(prueba, r) { return prueba === 'DJ' ? (r.rsi ?? r.h) : r.h; }

/** Agrupa intentos válidos en sesiones con mejor intento, medias y CV de la altura. */
function buildSessions(trials, athById, S) {
  const map = new Map();
  for (const t of trials) {
    if (t.valido === false) continue;
    const ath = athById[t.atletaId]; if (!ath) continue;
    const r = computeTrial(t, ath, S); if (!r.ok) continue;
    const k = sessionKey(t);
    let s = map.get(k);
    if (!s) { s = { key: k, atletaId: t.atletaId, fecha: t.fecha, prueba: t.prueba, carga: +(t.carga || 0), caida: +(t.caida || 0), items: [] }; map.set(k, s); }
    s.items.push({ t, r });
  }
  const out = [];
  for (const s of map.values()) {
    s.items.sort((a, b) => (a.t.intento || 0) - (b.t.intento || 0));
    s.n = s.items.length;
    s.best = s.items.reduce((b, x) => (primaryValue(s.prueba, x.r) ?? -1) > (primaryValue(s.prueba, b.r) ?? -1) ? x : b, s.items[0]);
    const hs = s.items.map(x => x.r.h).filter(v => v != null);
    s.hMean = mean(hs); s.hSd = sd(hs); s.cv = cvPct(hs);
    s.mean = {};
    for (const mk of Object.keys(METRICS)) {
      const vals = s.items.map(x => METRICS[mk].get(x.r)).filter(v => v != null && isFinite(v));
      s.mean[mk] = vals.length ? mean(vals) : null;
    }
    out.push(s);
  }
  out.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  return out;
}
/** Valor de una sesión para una métrica, según el criterio (mejor intento o media de intentos). */
function sessionValue(s, metric, agg) {
  if (agg === 'media') return s.mean[metric];
  return METRICS[metric].get(s.best.r);
}

/** Índices de Bosco, asimetría y RSI a partir de las sesiones (sin carga) de una fecha. */
function indicesFrom(sessByTest) {
  const h = id => { const s = sessByTest[id]; return s ? s.best.r.h : null; };
  const out = {};
  const sj = h('SJ'), cmj = h('CMJ'), abk = h('ABK'), hi = h('CMJ_I'), hd = h('CMJ_D');
  if (sj && cmj) { out.IE = (cmj - sj) / sj * 100; out.EUR = cmj / sj; }
  if (cmj && abk) out.IUB = (abk - cmj) / cmj * 100;
  if (hi && hd) { const mx = Math.max(hi, hd), mn = Math.min(hi, hd); out.asim = (mx - mn) / mx * 100; out.lado = hi > hd ? 'izquierda' : hd > hi ? 'derecha' : 'equilibrio'; }
  if (sessByTest.DJ && sessByTest.DJ.best.r.rsi != null) out.rsi = sessByTest.DJ.best.r.rsi;
  return out;
}

/** Perfil fuerza-velocidad (Samozino): una regresión lineal F̄(v̄) con el mejor salto de cada carga. */
function fvProfile(items, ath, S) {
  const g = S && S.g ? S.g : 9.81;
  const hpo = hpoOf(ath);
  if (!hpo) return { error: 'El deportista no tiene registrada la distancia de impulso (hpo).' };
  const mass = ath.masa;
  const byLoad = new Map();
  for (const { t, r } of items) {
    const L = +(t.carga || 0);
    const m = t.masa > 0 ? t.masa : mass;
    if (!(m > 0) || !(r.h > 0)) continue;
    const cur = byLoad.get(L);
    if (!cur || r.h > cur.h) byLoad.set(L, { carga: L, h: r.h, masa: m, t });
  }
  const pts = [...byLoad.values()].sort((a, b) => a.carga - b.carga).map(p => {
    const F = (p.masa + p.carga) * g * (p.h / hpo + 1);
    const v = Math.sqrt(g * p.h / 2);
    return { ...p, F, Frel: F / p.masa, v, P: F * v / p.masa };
  });
  if (pts.length < 2) return { error: 'Se necesitan saltos con al menos dos cargas distintas en la misma fecha.', pts };
  const reg = linReg(pts.map(p => p.v), pts.map(p => p.Frel));
  if (!reg || reg.b >= 0) return { error: 'La relación fuerza-velocidad no es decreciente con estos datos; revisa los intentos.', pts };
  const F0 = reg.a, V0 = -reg.a / reg.b;
  return { pts, F0, V0, Pmax: F0 * V0 / 4, Sfv: reg.b, r2: reg.r2, hpo, a: reg.a, b: reg.b };
}

/** Caracterización de cambio entre la última sesión y la media de las previas (seguimiento). */
function changeVsBaseline(values, nBase = 3) {
  if (values.length < 2) return null;
  const last = values[values.length - 1];
  const base = values.slice(Math.max(0, values.length - 1 - nBase), values.length - 1);
  const m = mean(base.map(x => x.v));
  if (!m) return null;
  return { last, base: m, pct: (last.v - m) / m * 100, nBase: base.length };
}

/** Siguiente número de intento para una sesión. */
function nextTrialNumber(trials, atletaId, fecha, prueba, carga, caida) {
  const k = sessionKey({ atletaId, fecha, prueba, carga, caida });
  let mx = 0;
  for (const t of trials) if (sessionKey(t) === k) mx = Math.max(mx, t.intento || 0);
  return mx + 1;
}
function athleteName(a) { return a ? [a.nombre, a.apellidos].filter(Boolean).join(' ') : '(sin deportista)'; }
function testLabel(id) { return TESTS[id] ? TESTS[id].corto : id; }
function sessionLabel(s) {
  let l = testLabel(s.prueba);
  if (s.carga > 0) l += ` +${fmt(s.carga, 0)} kg`;
  if (s.caida > 0) l += ` (${fmt(s.caida, 0)} cm)`;
  return l;
}

/* ============================================================
   JumpLab 1.0 · almacenamiento
   - Nube (base de datos privada del artifact en Claude), si está disponible.
   - IndexedDB del navegador, si la aplicación se aloja en otra web o se abre como archivo.
   - Memoria, como último recurso (avisa al usuario).
   Las miniaturas de fotogramas se guardan siempre en este dispositivo (IndexedDB).
   ============================================================ */

const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      let rq;
      try { rq = indexedDB.open('jumplab', 1); } catch (e) { rej(e); return; }
      rq.onupgradeneeded = () => {
        const d = rq.result;
        for (const s of ['athletes', 'trials', 'thumbs', 'kv']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: s === 'kv' ? 'k' : 'id' });
      };
      rq.onsuccess = () => { this.db = rq.result; res(this.db); };
      rq.onerror = () => rej(rq.error || new Error('IndexedDB no disponible'));
      rq.onblocked = () => rej(new Error('IndexedDB bloqueada'));
    });
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode);
      const os = tx.objectStore(store);
      let out;
      try { out = fn(os); } catch (e) { rej(e); return; }
      tx.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('Transacción abortada'));
    });
  },
  getAll(store) { return this._tx(store, 'readonly', os => os.getAll()); },
  get(store, key) { return this._tx(store, 'readonly', os => os.get(key)); },
  putMany(store, arr) { return this._tx(store, 'readwrite', os => { for (const o of arr) os.put(o); }); },
  delMany(store, ids) { return this._tx(store, 'readwrite', os => { for (const id of ids) os.delete(id); }); },
  clear(store) { return this._tx(store, 'readwrite', os => os.clear()); },
};

function cleanObj(o) { return JSON.parse(JSON.stringify(o)); }

const LocalAdapter = {
  mode: 'idb',
  async init() { await IDB.open(); },
  async load() {
    const [a, t, kv] = await Promise.all([IDB.getAll('athletes'), IDB.getAll('trials'), IDB.getAll('kv')]);
    const g = k => (kv.find(x => x.k === k) || {}).v;
    return { athletes: a || [], trials: t || [], settings: g('settings'), meta: g('meta') };
  },
  saveAthletes(list) { return IDB.putMany('athletes', list.map(cleanObj)); },
  deleteAthletes(ids) { return IDB.delMany('athletes', ids); },
  saveTrials(list) { return IDB.putMany('trials', list.map(cleanObj)); },
  deleteTrials(list) { return IDB.delMany('trials', list.map(t => t.id)); },
  saveSettings(s) { return IDB.putMany('kv', [{ k: 'settings', v: cleanObj(s) }]); },
  saveMeta(m) { return IDB.putMany('kv', [{ k: 'meta', v: cleanObj(m) }]); },
  async clearAll() { await IDB.clear('athletes'); await IDB.clear('trials'); await IDB.clear('kv'); },
};

const MemoryAdapter = {
  mode: 'memory',
  async init() { }, async load() { return { athletes: [], trials: [] }; },
  async saveAthletes() { }, async deleteAthletes() { }, async saveTrials() { }, async deleteTrials() { },
  async saveSettings() { }, async saveMeta() { }, async clearAll() { },
};

/** Cola en serie: una escritura cada vez (la base de la nube exige no solapar escrituras al mismo documento). */
function serialQueue() {
  let p = Promise.resolve();
  return fn => { const run = p.then(fn, fn); p = run.catch(() => { }); return run; };
}
async function withRetry(fn, tries = 4) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      const code = e && e.code;
      if (i >= tries - 1 || !(code === 'unavailable' || code === 'resource_exhausted' || code == null && i < 1)) throw e;

      const snap = await withRetry(() => q.get());
      for (const d of snap.docs) out.push(d.data());

    async init() { },
    async load() {

    },
    saveAthletes(list) { return queue(async () => { for (const a of list) await withRetry(() => athC.doc(a.id).set({ key: a.id, a: cleanObj(a) })); }); },
    deleteAthletes(ids) { return queue(async () => { for (const id of ids) await withRetry(() => athC.doc(id).delete()); }); },
    saveTrials(list, oldList = []) {
      const keys = new Set(); list.forEach(t => keys.add(chunkKey(t))); oldList.forEach(t => t && keys.add(chunkKey(t)));

    },
    deleteTrials(list) {

    },
    saveSettings() { return queue(() => withRetry(() => base.set(rootBody()))); },
    saveMeta() { return queue(() => withRetry(() => base.set(rootBody()))); },
    clearAll() {
      return queue(async () => {

/* ---------- Copia de seguridad JSON ---------- */
function buildBackup({ athletes, trials, settings, thumbs }) {
  const o = { app: APP.name, version: APP.version, schema: APP.schema, exportado: new Date().toISOString(), athletes, trials, settings };
  if (thumbs && thumbs.length) o.thumbs = thumbs;
  return JSON.stringify(o, null, 1);
}
function parseBackup(text) {
  let o; try { o = JSON.parse(text); } catch (e) { throw new Error('El archivo no es un JSON válido.'); }
  if (!o || o.app !== APP.name || !Array.isArray(o.athletes) || !Array.isArray(o.trials)) throw new Error('El archivo no es una copia de seguridad de JumpLab.');
  return o;
}

/* ---------- Guardar, compartir, copiar ---------- */
const MIME = { csv: 'text/csv;charset=utf-8', json: 'application/json', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', html: 'text/html;charset=utf-8', png: 'image/png', txt: 'text/plain;charset=utf-8' };

/** Descarga un archivo. Dentro del visor de Claude usa la capacidad de descargas (con confirmación). */
async function saveFile(filename, data) {
  const blob = toBlob(data, filename);
  if (inClaudeViewer()) {
    const d = await downloadsCap();
    if (d) {
      try { await d.save({ filename, data: blob }); toast('Archivo preparado: ' + filename); return true; }
      catch (e) {
        if (e && e.code === 'declined') return false;
        if (e && e.code === 'rate_limited') { toast('Hay otra descarga pendiente de confirmar.', { kind: 'err' }); return false; }
      }
    }
    return fallbackCopy(filename, blob);
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
    toast('Descargado: ' + filename);
    return true;
  } catch (e) { return fallbackCopy(filename, blob); }
}
async function fallbackCopy(filename, blob) {
  const isText = /\.(csv|json|txt|html)$/i.test(filename);
  if (!isText) { await infoDialog('Descarga no disponible', `<p>Este entorno no permite descargar <b>${esc(filename)}</b>. Abre JumpLab en tu navegador (o desde tu web) para descargarlo.</p>`); return false; }
  const text = await blob.text();
  await openModal({
    title: 'Copiar contenido', wide: true,
    body: `<p>Este entorno no permite descargar archivos. Copia el contenido y pégalo en un archivo <b>${esc(filename)}</b>.</p><textarea id="fb-text" style="min-height:260px" readonly></textarea>`,
    actions: [{ label: 'Cerrar', value: null, kind: 'ghost' }, { label: 'Copiar', value: 'copy', kind: 'primary' }],
    onMount: w => { w.querySelector('#fb-text').value = text; },
    onAction: async v => { if (v === 'copy') { await copyText(text); return false; } },
  });
  return false;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copiado al portapapeles'); return true; }
  catch (e) {
    try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); if (ok) { toast('Copiado al portapapeles'); return true; } } catch (e2) { }
    toast('No se pudo copiar automáticamente: selecciona el texto y cópialo.', { kind: 'err' }); return false;
  }
}
function canShareFiles() {
  if (inClaudeViewer()) return false;
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.txt', { type: 'text/plain' })] })); } catch (e) { return false; }
}

  const file = new File([toBlob(data, filename)], filename, { type: MIME[fileExt(filename)] || 'application/octet-stream' });

  async autoDetect() {
    if (!this.loaded() || !this.roi || this.busy) return;
    const T = this.testDef();
    const win = num($('#va-win').value) || 2.5;
    const start = this.cur;
    let end = start;
    if (this.slow) end = start + Math.round(win * this.captureFps);
    else { const t0 = this.frameTime(start); end = this.timeToFrame(t0 + win); }
    end = Math.min(this.frameCount() - 1, end);
    if (end - start < 6) { toast('La ventana es demasiado corta o estás al final del vídeo.', { kind: 'err' }); return; }
    this.busy = true; this.abort = false; this.renderDetect('Analizando fotogramas…');
    const roi = this.roi; const Wd = 96; const Hd = clamp(Math.round(roi.h), 6, 64);
    const cv = document.createElement('canvas'); cv.width = Wd; cv.height = Hd; const g = cv.getContext('2d', { willReadFrequently: true });
    const n = end - start + 1; const grays = new Array(n);
    const grab = idx => { g.drawImage(this.vid, roi.x, roi.y, roi.w, roi.h, 0, 0, Wd, Hd); const d = g.getImageData(0, 0, Wd, Hd).data; const a = new Float32Array(Wd * Hd); let s = 0; for (let i = 0, j = 0; i < d.length; i += 4, j++) { const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; a[j] = y; s += y; } const m = s / a.length || 1; for (let j = 0; j < a.length; j++) a[j] /= m; grays[idx - start] = a; };
    const prog = p => { const i = $('#va-prog i'); if (i) i.style.width = Math.round(p * 100) + '%'; };
    const v = this.vid;
    try {
      // 1) captura rápida reproduciendo a velocidad reducida
      if ('requestVideoFrameCallback' in v) {
        await seekRaw(v, this.seekTime(start));
        const rate = clamp(40 / (this.info.fileFps || 30), 0.0625, 1);
        await new Promise(res => {
          let done = false; const fin = () => { if (done) return; done = true; v.pause(); res(); };
          const cb = (now, m) => {
            if (done) return;
            const f = this.timeToFrame(m.mediaTime);
            if (f >= start && f <= end && !grays[f - start]) grab(f);
            prog((f - start) / n * 0.9);
            if (f >= end || this.abort || v.ended) fin(); else v.requestVideoFrameCallback(cb);
          };
          v.playbackRate = rate; v.requestVideoFrameCallback(cb); v.play().catch(fin);
          setTimeout(fin, (n / (this.info.fileFps || 30)) / rate * 1000 + 15000);
        });
      }
      // 2) completar los fotogramas que falten buscando uno a uno
      const missing = []; for (let i = 0; i < n; i++) if (!grays[i]) missing.push(start + i);
      for (let k = 0; k < missing.length; k++) {
        if (this.abort) break;
        await seekRaw(v, this.seekTime(missing[k])); grab(missing[k]);
        if (k % 4 === 0) { prog(0.9 * (1 - (missing.length - k) / Math.max(n, 1)) + 0.1 * k / missing.length); await sleep(0); }
      }
      if (this.abort) throw new Error('Detección cancelada.');
      prog(1);
      const analyze = () => {
        // 3) referencia «suelo vacío»: fotograma más distinto del inicial (en vuelo); en DJ, el inicial (aún en el cajón)
        const diff = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]); return s / a.length; };
        let refIdx = 0;
        if (T.id !== 'DJ') { let mx = -1; for (let i = 0; i < n; i++) { const d = diff(grays[i], grays[0]); if (d > mx) { mx = d; refIdx = i; } } }
        const ref = grays[refIdx];
        const e = grays.map(gr => diff(gr, ref));
        // 4) por filas: una fila tiene pie si al menos 3 píxeles difieren claramente del suelo vacío
        //    (así cuenta el contacto de la punta del pie aunque el talón ya esté elevado)
        const sample = []; for (const gr of grays) for (let i = 0; i < gr.length; i += 5) sample.push(Math.abs(gr[i] - ref[i]));
        const thrPix = otsu(sample);
        const minPix = Math.max(3, Math.round(Wd * 0.03));
        const low = grays.map(gr => { for (let y = Hd - 1; y >= 0; y--) { let c = 0; for (let x = 0; x < Wd; x++) if (Math.abs(gr[y * Wd + x] - ref[y * Wd + x]) > thrPix) c++; if (c >= minPix) return y; } return -1; });
        const lows = low.filter(x => x >= 0).sort((a, b) => a - b);
        const G = lows.length ? lows[Math.floor(lows.length * 0.9)] : -1;
        let present = low.map(L => L >= 0 && L >= G - 1);
        present = present.map((p, i) => { if (i === 0 || i === n - 1) return p; const c = (present[i - 1] ? 1 : 0) + (p ? 1 : 0) + (present[i + 1] ? 1 : 0); return c >= 2; });
        const thr = otsu(e);
        const hiVals = e.filter(x => x > thr), loVals = e.filter(x => x <= thr);

        const contrast = hiVals.length && loVals.length ? (mean(hiVals) - mean(loVals)) / (eMax || 1) : 0;

      };
      let A1 = analyze();
      // 5) refinado: los fotogramas junto a cada transición se vuelven a leer buscando uno a uno (exactos)
      const near = new Set(); for (const t of A1.res.tr) for (let k = t.i - 3; k <= t.i + 3; k++) if (k >= 0 && k < n) near.add(k);

      if (near.size) A1 = analyze();
      const { e, thr, contrast, res } = A1;
      const marks = [];
      if (T.seq) {
        this.seq = res.seq.map(s => ({ tipo: s.tipo, f: s.f + start }));
        this.seq.forEach(s => marks.push({ i: s.f - start, color: cssVar('--s' + EVENTS[s.tipo].color), label: s.tipo === 'despegue' ? 'D' : 'A' }));
      } else {
        for (const k of Object.keys(res.ev)) { this.ev[k] = res.ev[k] + start; marks.push({ i: res.ev[k], color: cssVar('--s' + EVENTS[k].color), label: EVENTS[k].key }); }
      }
      const found = T.seq ? this.seq.length : Object.keys(res.ev).length;
      const need = T.seq ? 2 : T.ev.length;
      let msg = found >= need ? `Propuesta: ${T.seq ? Math.floor(this.seq.length / 2) + ' saltos' : Object.keys(res.ev).map(k => EVENTS[k].nombre.toLowerCase() + ' en ' + (res.ev[k] + start)).join(', ')}. Revisa cada evento fotograma a fotograma antes de guardar.` : 'No se encontraron todas las transiciones. Ajusta la zona de apoyo (más estrecha, junto al suelo) o el punto de inicio.';
      if (contrast < 0.25) msg += ' Contraste bajo entre pies y suelo: la propuesta es poco fiable.';
      this.det = { start, end, values: e, msg, sig: { values: e, thr, marks } };
      this.busy = false;
      // miniaturas de los eventos detectados
      if (!T.seq) for (const k of Object.keys(res.ev)) { await this.seek(this.ev[k]); this.captureThumb(k); }
      const first = T.seq ? (this.seq[0] && this.seq[0].f) : (this.ev.contacto ?? this.ev.despegue);
      if (first != null) await this.seek(first);
    } catch (err) {
      this.busy = false; this.det = { msg: err.message || String(err) };
      try { v.pause(); } catch (e) { }
    }

  },

  /** Atajos de teclado (solo con la vista de análisis activa y sin foco en un campo). */
  onKey(e) {
    if (this.mode !== 'video' || !this.loaded()) return false;
    const k = e.key;
    if (k === 'Escape' && this.expanded) { this.toggleExpand(false); return true; }
    if (k === 'ArrowRight' || k === 'ArrowLeft') { this.step((k === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 10 : 1)); return true; }
    if (k === 'PageDown' || k === 'PageUp') { this.step((k === 'PageDown' ? 1 : -1) * Math.round(this.info.fileFps)); return true; }
    if (k === 'Home') { this.seek(0); return true; }
    if (k === 'End') { this.seek(this.frameCount() - 1); return true; }
    if (k === ' ') { this.togglePlay(); return true; }
    const up = k.toUpperCase();

async function persist(fn) {

  catch (e) {
    console.error(e); setSync('error');
    const code = e && e.code;
    const msg = code === 'quota_exceeded' ? 'La base de datos ha alcanzado su capacidad máxima: exporta una copia y elimina datos antiguos.' : code === 'invalid_argument' ? 'No tienes permiso para guardar en esta base de datos.' : 'No se pudo guardar: ' + (e.message || code || e);
    toast(msg, { kind: 'err' }); return false;
  }
}
async function persistSettings() { setSync('saving'); try { await Store.saveSettings(State.settings); setSync('ok'); } catch (e) { setSync('error'); } }

async function addTrials(list) { State.trials.push(...list); touch(); refreshAfterChange(); return persist(() => Store.saveTrials(list, [])); }

  State.trials = State.trials.filter(t => !ids.has(t.id)); list.forEach(t => State.deleted.add(t.id)); touch(); refreshAfterChange();
  return persist(() => Store.deleteTrials(list));
}
async function saveAthlete(a) {

  reindex(); touch(); refreshAfterChange(); return persist(() => Store.saveAthletes([a]));
}

  if (trials.length) await removeTrials(trials);

function latestByTest(atletaId) {
  const out = {};
  for (const s of allSessions()) {
    if (s.atletaId !== atletaId || s.carga > 0) continue;
    const cur = out[s.prueba];
    if (!cur || s.fecha > cur.fecha || (s.fecha === cur.fecha && primaryValue(s.prueba, s.best.r) > primaryValue(s.prueba, cur.best.r))) out[s.prueba] = s;
  }
  return out;
}
function dateSeries(atletaId, prueba, metric, agg, desde, hasta) {
  const byDate = new Map();
  for (const s of allSessions()) {
    if (s.atletaId !== atletaId || s.prueba !== prueba || s.carga > 0) continue;
    if (desde && s.fecha < desde) continue; if (hasta && s.fecha > hasta) continue;
    const v = sessionValue(s, metric, agg); if (v == null || !isFinite(v)) continue;
    const cur = byDate.get(s.fecha);
    const pv = primaryValue(s.prueba, agg === 'media' ? { h: s.hMean, rsi: s.mean.rsi } : s.best.r);
    if (!cur || pv > cur.pv) byDate.set(s.fecha, { fecha: s.fecha, v, pv, s });
  }
  return [...byDate.values()].sort((a, b) => a.fecha < b.fecha ? -1 : 1);
}
/** Índices calculados en la sesión más reciente que contiene ambas pruebas de cada par (no mezcla fechas). */
function latestIndices(atletaId, inPeriod) {
  const byDate = {};
  for (const s of allSessions()) {
    if (s.atletaId !== atletaId || s.carga > 0 || (inPeriod && !inPeriod(s.fecha))) continue;
    const m = byDate[s.fecha] || (byDate[s.fecha] = {}); const c = m[s.prueba];
    if (!c || primaryValue(s.prueba, s.best.r) > primaryValue(s.prueba, c.best.r)) m[s.prueba] = s;
  }
  const dates = Object.keys(byDate).sort().reverse(); const out = {};
  const pick = (keys, fn) => { for (const d of dates) { if (keys.every(k => byDate[d][k])) { fn(indicesFrom(byDate[d]), d); return; } } };
  pick(['SJ', 'CMJ'], (I, d) => { out.IE = I.IE; out.EUR = I.EUR; out.dIE = d; });
  pick(['CMJ', 'ABK'], (I, d) => { out.IUB = I.IUB; out.dIUB = d; });
  pick(['CMJ_I', 'CMJ_D'], (I, d) => { out.asim = I.asim; out.lado = I.lado; out.dAsim = d; });
  pick(['DJ'], (I, d) => { out.rsi = I.rsi; out.dRsi = d; });
  return out;
}

    const a = A(t.atletaId); if (!a) return false;
    if (f.ath && t.atletaId !== f.ath) return false;
    if (f.group && a.grupo !== f.group) return false;
    if (f.test && t.prueba !== f.test) return false;
    if (f.desde && t.fecha < f.desde) return false;
    if (f.hasta && t.fecha > f.hasta) return false;
    if (!f.invalid && t.valido === false) return false;

}

/* ---------- Protocolo y método ---------- */
function renderProtocolo(el) {
  const g = State.settings.g || 9.81; const tf30 = tfFromH(0.30, g);
  const prec = [30, 60, 120, 240, 480].map(f => { const d = 1 / f; return [f, fmt(d * 1000, 1), fmt((hFromTf(tf30 + d, g) - hFromTf(tf30 - d, g)) / 2 * 100, 2)]; });
  el.innerHTML = `<div class="view-head"><div><h1>Protocolo y método</h1><p>Cómo grabar, cómo marcar los fotogramas y qué calcula JumpLab, con sus referencias.</p></div></div>
  <div class="grid g-side"><div class="card doc">
    <h2>Grabación</h2><ul>
      <li>Usa la mayor frecuencia de imagen disponible (cámara lenta). La precisión depende directamente de los fps (tabla).</li>
      <li>Móvil o cámara fijos (trípode o apoyo estable), a la altura de los pies, a 1–2 m y perpendiculares al plano del salto. Encuadra pies y suelo durante todo el salto.</li>
      <li>Buena iluminación; a alta velocidad algunas luces parpadean: si el vídeo «late», cambia de luz o de zona.</li>
      <li>Calzado y suelo con contraste. Evita que otras personas crucen la zona de apoyo (estorba a la detección asistida).</li>
      <li>Si el vídeo se exporta ralentizado (p. ej., 240 fps guardado a 30 fps), indica en el análisis los fps reales de captura.</li></ul>
    <h3>Ejecución</h3><ul>
      <li><b>SJ</b>: 90° de flexión de rodilla mantenida 2–3 s, sin contramovimiento, manos en la cintura. <b>CMJ</b>: contramovimiento libre, manos en la cintura. <b>Abalakov</b>: CMJ con brazos libres. <b>Unipodales</b>: CMJ con una pierna, manos en la cintura.</li>
      <li><b>Drop Jump</b>: dejarse caer del cajón (sin saltar hacia arriba), contacto lo más breve posible y salto máximo. Registra la altura de caída.</li>
      <li><b>Saltos repetidos (RJ)</b>: saltos máximos continuos con contactos breves (p. ej., 15 s de Bosco o un número fijo de saltos).</li>
      <li>Despega y aterriza con rodillas y tobillos extendidos, en el mismo punto. El método del tiempo de vuelo supone la misma posición del centro de masas en despegue y aterrizaje: flexionar las piernas antes de tocar el suelo alarga el vuelo y sobrestima la altura.</li>
      <li>Realiza al menos 2–3 intentos válidos por prueba, con recuperación completa entre ellos (30–60 s), y usa siempre el mismo protocolo para comparar en el tiempo.</li></ul>
    <h3>Marcado de fotogramas</h3><ul>
      <li><b>Despegue</b>: primer fotograma con ambos pies en el aire. <b>Aterrizaje</b>: primer fotograma con al menos un pie en contacto (Balsalobre-Fernández et al., 2015).</li>
      <li><b>Contacto inicial (DJ)</b>: primer fotograma con contacto tras la caída. <b>Inicio del movimiento (CMJ, opcional)</b>: primer fotograma con descenso visible, para el tiempo hasta el despegue y el RSImod.</li>
      <li>Usa la lupa (aumento 3–6×) y la línea de suelo para decidir fotogramas dudosos. La detección asistida solo propone fotogramas: revísalos siempre.</li></ul>
    <h2 style="margin-top:22px">Cálculos</h2>
    <p>Altura a partir del tiempo de vuelo (Bosco et al., 1983):</p><div class="formula">h = g · tv² / 8      v₀ = g · tv / 2</div>
    <p>Potencia estimada (m = masa corporal en kg, h en cm salvo que se indique):</p>
    <div class="formula">Sayers (pico): P = 60,7·h + 45,3·m − 2055</div>
    <div class="formula">Harman (pico): P = 61,9·h + 36,0·m − 1822      Harman (media): P = 21,2·h + 23,0·m − 1393</div>
    <div class="formula">Lewis (media): P = √4,9 · m · √h(m) · 9,81</div>
    <div class="formula">Samozino (media): F = M·g·(h/hpo + 1)   v = √(g·h/2)   P = F·v   (M = masa + carga; h, hpo en m)</div>
    <p class="small muted">Para Harman (pico) se usa la constante −1822, que reproduce la potencia media del estudio original (≈ 3767 W); algunas fuentes la transcriben como +1822. Las ecuaciones de regresión se aplican solo a saltos sin carga.</p>
    <p>Drop Jump y saltos repetidos (Bosco et al., 1983):</p>
    <div class="formula">RSI = h / tc      P (W/kg) = g² · Tv · Tt / (4 · n · Tc)</div>
    <p>RSImod = h / tiempo hasta el despegue (Ebben y Petushek, 2010). Índices: elasticidad = (CMJ − SJ)/SJ·100; ratio CMJ/SJ; brazos = (ABK − CMJ)/CMJ·100; asimetría = (mayor − menor)/mayor·100 (Bishop et al., 2018).</p>
    <p>Perfil fuerza-velocidad: regresión lineal F̄(v̄) con el mejor salto de cada carga; F0 y V0 son los cortes con los ejes y Pmax = F0·V0/4 (Samozino et al., 2008; Jiménez-Reyes et al., 2017).</p>
    <h3>Fiabilidad</h3><ul>
      <li>JumpLab muestra la incertidumbre de ±1 fotograma de cada salto y el coeficiente de variación (CV) entre intentos de una sesión; un CV alto indica técnica o marcado inconsistentes.</li>
      <li>La altura obtenida del vídeo es una medida válida; la fuerza, velocidad y potencia derivadas de ella deben interpretarse con más prudencia (Vieira et al., 2023).</li>
      <li>Los tiempos de cada fotograma se leen del propio archivo MP4/MOV cuando es posible, incluso con frecuencia de imagen variable.</li></ul>
  </div>
  <div class="stack" style="gap:16px">
    <div class="card"><h2 style="margin-bottom:10px">Precisión según los fps</h2><p class="small muted" style="margin-bottom:8px">Error de ±1 fotograma en un salto de 30 cm (g = ${fmt(g, 2)}).</p>${table(['fps', '1 fotograma (ms)', '± altura (cm)'], prec, [0, 1, 2])}</div>
    <div class="card"><h2 style="margin-bottom:10px">Atajos de teclado</h2>${table(['Tecla', 'Acción'], [['← / →', 'Fotograma anterior / siguiente'], ['Mayús + ← / →', '10 fotogramas'], ['Re Pág / Av Pág', '1 segundo'], ['Inicio / Fin', 'Primer / último fotograma'], ['Espacio', 'Reproducir / pausa'], ['D', 'Marcar despegue'], ['A', 'Marcar aterrizaje'], ['C', 'Marcar contacto inicial (DJ)'], ['I', 'Marcar inicio del movimiento']].map(([a, b]) => [`<kbd>${a}</kbd>`, b]))}</div>
    <div class="card doc"><h2 style="margin-bottom:6px">Referencias</h2><ul class="refs">
      <li>Balsalobre-Fernández C, Glaister M, Lockey RA. The validity and reliability of an iPhone app for measuring vertical jump performance. J Sports Sci. 2015;33(15):1574-9.</li>
      <li>Bishop C, Read P, Lake J, Chavda S, Turner A. Interlimb asymmetries: understanding how to calculate differences from bilateral and unilateral tests. Strength Cond J. 2018;40(4):1-6.</li>
      <li>Bosco C. La valoración de la fuerza con el test de Bosco. Barcelona: Paidotribo; 1994.</li>
      <li>Bosco C, Luhtanen P, Komi PV. A simple method for measurement of mechanical power in jumping. Eur J Appl Physiol. 1983;50(2):273-82.</li>
      <li>Ebben WP, Petushek EJ. Using the reactive strength index modified to evaluate plyometric performance. J Strength Cond Res. 2010;24(8):1983-7.</li>
      <li>Harman EA, Rosenstein MT, Frykman PN, Rosenstein RM, Kraemer WJ. Estimation of human power output from vertical jump. J Appl Sport Sci Res. 1991;5(3):116-20.</li>
      <li>Jiménez-Reyes P, Samozino P, Pareja-Blanco F, et al. Validity of a simple method for measuring force-velocity-power profile in countermovement jump. Int J Sports Physiol Perform. 2017;12(1):36-43.</li>
      <li>Sayers SP, Harackiewicz DV, Harman EA, Frykman PN, Rosenstein MT. Cross-validation of three jump power equations. Med Sci Sports Exerc. 1999;31(4):572-7.</li>
      <li>Samozino P, Morin JB, Hintzy F, Belli A. A simple method for measuring force, velocity and power output during squat jump. J Biomech. 2008;41(14):2940-5.</li>
      <li>Vieira A, et al. Evidence of validity and reliability of Jumpo 2 and MyJump 2 for estimating vertical jump variables. PeerJ. 2023;11:e14558.</li></ul></div>
  </div></div>`;
}

   ============================================================ */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/** Datos ficticios (marcados como ejemplo) para explorar la aplicación sin una base de datos propia. */
function makeDemo() {
  const rnd = mulberry32(20261115);
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const g = 9.81, FPS = 240;
  const P = [
    ['Lucía', 'Remo · Sub-23', 'Remo', 'F', '2004-05-14', 64, 172, 98, 56, 27.5, 30.5, 35.0],
    ['Marcos', 'Remo · Sub-23', 'Remo', 'M', '2003-09-02', 79, 186, 106, 61, 35.0, 38.5, 44.0],
    ['Daniel', 'Remo · Sub-23', 'Remo', 'M', '2004-01-21', 83, 189, 108, 63, 33.0, 36.0, 41.5],
    ['Irene', 'Baloncesto · Sénior F', 'Baloncesto', 'F', '2001-11-30', 71, 183, 104, 60, 28.5, 32.0, 38.5],
    ['Nerea', 'Baloncesto · Sénior F', 'Baloncesto', 'F', '2002-07-08', 65, 175, 99, 57, 30.0, 34.0, 40.0],
    ['Sara', 'Baloncesto · Sénior F', 'Baloncesto', 'F', '2003-03-17', 60, 168, 95, 55, 26.0, 29.5, 34.5],
  ];
  const now = new Date(); const dates = [];
  for (let i = 7; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i * 21 - 4); dates.push(dateToISO(d)); }
  const ts = Date.now();
  const athletes = P.map((p, i) => ({ id: 'demo' + (i + 1), nombre: p[0], apellidos: '(ejemplo)', grupo: p[1], deporte: p[2], sexo: p[3], nacimiento: p[4], masa: p[5], talla: p[6], piernaCm: p[7], sentadillaCm: p[8], notas: 'Deportista ficticio de ejemplo.', demo: true, creado: ts, modificado: ts }));
  const trials = [];
  const add = (a, fecha, prueba, intento, extra) => {
    const t = { id: uid(), atletaId: a.id, fecha, hora: '10:' + String(10 + intento * 3).padStart(2, '0'), prueba, intento, masa: round(a.masa + gauss() * 0.3, 1), carga: 0, caida: 0, metodo: 'video', video: 'ejemplo.mov', valido: true, notas: '', demo: true, creado: ts, modificado: ts, ...extra };
    trials.push(t); return t;
  };
  const tvFrames = hCm => { const n = Math.round(tfFromH(hCm / 100, g) * FPS); return { tv: n / FPS, n }; };
  athletes.forEach((a, ai) => {
    const p = P[ai]; const base = { SJ: p[9], CMJ: p[10], ABK: p[11] };
    const asym = 0.03 + rnd() * 0.09, leftWeak = rnd() < 0.5;
    const djOpt = [20, 30, 30, 40, 30, 20][ai];
    let drift = 0;
    dates.forEach((fecha, di) => {
      drift += 0.32 + gauss() * 0.55;
      if (ai === 4 && di === 7) drift -= 2.6; // descenso reciente (fatiga simulada)
      for (const k of ['SJ', 'CMJ', 'ABK']) for (let i = 1; i <= 3; i++) {
        const { tv, n } = tvFrames(base[k] + drift * (k === 'SJ' ? 0.8 : 1) + gauss() * 0.7);
        add(a, fecha, k, i, { tv, eventos: { modo: 'fps', fpsArchivo: FPS, fpsCaptura: FPS, frames: { despegue: 300, aterrizaje: 300 + n }, incertidumbre: 1 / FPS } });
      }
      if (di === 2 || di === 5 || di === 7) for (const k of ['CMJ_I', 'CMJ_D']) for (let i = 1; i <= 2; i++) {
        const weak = (k === 'CMJ_I') === leftWeak;
        const { tv, n } = tvFrames((base.CMJ + drift) * 0.54 * (weak ? 1 - asym : 1) + gauss() * 0.5);
        add(a, fecha, k, i, { tv, eventos: { modo: 'fps', fpsArchivo: FPS, fpsCaptura: FPS, frames: { despegue: 280, aterrizaje: 280 + n }, incertidumbre: 1 / FPS } });
      }
      if (di === 3 || di === 7) for (const caida of [20, 30, 40]) for (let i = 1; i <= 2; i++) {
        const f = 1 - Math.abs(caida - djOpt) * 0.0035;
        const { tv, n } = tvFrames((base.CMJ + drift) * 0.88 * f + gauss() * 0.6);
        const tcF = Math.round((0.19 + (caida - 20) * 0.0016 + ai * 0.008 + Math.abs(gauss()) * 0.012) * FPS);
        add(a, fecha, 'DJ', i, { caida, tv, tc: tcF / FPS, eventos: { modo: 'fps', fpsArchivo: FPS, fpsCaptura: FPS, frames: { contacto: 200, despegue: 200 + tcF, aterrizaje: 200 + tcF + n }, incertidumbre: 1 / FPS } });
      }
      if (di === 6 && (ai === 1 || ai === 3)) {
        const hpo = (a.piernaCm - a.sentadillaCm) / 100; const F0 = ai === 1 ? 37 : 33, V0 = ai === 1 ? 2.9 : 2.7;
        for (const L of [20, 40, 60]) for (let i = 1; i <= 2; i++) {
          let lo = 0.01, hi = 0.8;
          for (let it = 0; it < 70; it++) { const h = (lo + hi) / 2; const F = (a.masa + L) * g * (h / hpo + 1) / a.masa; const v = Math.sqrt(g * h / 2); if (F > F0 * (1 - v / V0)) hi = h; else lo = h; }
          const { tv, n } = tvFrames(((lo + hi) / 2) * 100 + gauss() * 0.5);
          add(a, fecha, 'SJ', i, { carga: L, tv, masa: a.masa, eventos: { modo: 'fps', fpsArchivo: FPS, fpsCaptura: FPS, frames: { despegue: 300, aterrizaje: 300 + n }, incertidumbre: 1 / FPS } });
        }
      }
      if (di === 7 && (ai === 0 || ai === 4)) {
        const tf = [], tc = []; const t0 = tfFromH((base.CMJ + drift) * 0.85 / 100, g);
        for (let j = 0; j < 10; j++) { tf.push(Math.round((t0 * (1 - 0.011 * j) + gauss() * 0.006) * FPS) / FPS); if (j < 9) tc.push(Math.round((0.185 * (1 + 0.025 * j) + Math.abs(gauss()) * 0.008) * FPS) / FPS); }
        add(a, fecha, 'RJ', 1, { rj: { tf, tc } });
      }
    });
  });
  return { athletes, trials };
}

/* ---------- Tema ---------- */
let hostTheme = null, lastThemeSet = null;
function applyTheme() {
  const root = document.documentElement; const t = State.settings.tema;
  let val = t === 'claro' ? 'light' : t === 'oscuro' ? 'dark' : hostTheme;
  lastThemeSet = val;
  if (val) root.setAttribute('data-theme', val); else root.removeAttribute('data-theme');
  setTimeout(() => { Charts.rerenderAll(); if (State.ui.view === 'analisis' && VA.built) { VA.renderEvents(); VA.renderTimeline(); } }, 30);
}
function watchTheme() {
  hostTheme = document.documentElement.getAttribute('data-theme');
  new MutationObserver(() => {
    const cur = document.documentElement.getAttribute('data-theme');
    if (cur === lastThemeSet) return;
    hostTheme = cur;
    if (State.settings.tema !== 'auto') applyTheme(); else { lastThemeSet = cur; setTimeout(() => Charts.rerenderAll(), 30); }
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(() => { Charts.rerenderAll(); }, 30)); } catch (e) { }
}

/* ---------- Teclado ---------- */
function onGlobalKey(e) {
  if (document.querySelector('.modal-wrap')) return;
  const tg = e.target;
  if (tg && ((tg.tagName === 'INPUT' && !['checkbox', 'radio', 'button'].includes(tg.type)) || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable)) return;
  if (e.ctrlKey || e.metaKey) return;
  if (State.ui.view === 'analisis' && VA.built && VA.onKey(e)) e.preventDefault();
}

/* ---------- Arranque ---------- */
async function init() {
  buildShell();
  watchTheme();
  const main = $('#main');
  const loading = document.createElement('div'); loading.className = 'loading'; loading.innerHTML = '<div class="spinner"></div>Abriendo la base de datos…'; main.prepend(loading);
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', onGlobalKey);
  State.mode = await initStorage();
  let data = null;
  try { data = await Store.load(); }
  catch (e) {
    console.error(e);
    try { await LocalAdapter.init(); Store = LocalAdapter; State.mode = 'idb'; data = await Store.load(); toast('No se pudo leer la base de datos de tu cuenta; se usa este navegador.', { kind: 'err' }); }
    catch (e2) { Store = MemoryAdapter; State.mode = 'memory'; data = { athletes: [], trials: [] }; }
  }
  State.athletes = data.athletes || []; State.trials = data.trials || [];
  State.settings = { ...SETTINGS_DEFAULT, ...(data.settings || {}) };
  State.meta = data.meta || {};
  if (!State.athletes.length && !State.trials.length) { const d = makeDemo(); State.athletes = d.athletes; State.trials = d.trials; State.demo = true; }
  reindex(); touch();
  loading.remove();
  applyTheme(); renderChrome(); route();
  if (State.mode === 'idb' && navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) { } }
  if (State.mode === 'memory') toast('Este navegador no permite guardar datos: exporta una copia antes de cerrar.', { kind: 'err', timeout: 9000 });
}
document.addEventListener('DOMContentLoaded', init);

</script>
