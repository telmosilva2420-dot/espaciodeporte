<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSG Data 1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: filtros fijos a la izquierda y rejilla de fichas; ficha y editor como vistas a ancho completo */
  --bg:#eef1ee; --surface:#ffffff; --surface-2:#f5f7f5; --ink:#17211c; --muted:#5a6761; --line:#d6ddd8;
  --accent:#17654a; --accent-ink:#ffffff; --accent-soft:#dcebe3;
  --tec:#2a5db0; --tec-soft:#e2eaf8; --tac:#a94d1b; --tac-soft:#f8e7dd; --fis:#8b2f73; --fis-soft:#f4e2ef;
  --warn:#9a6a00; --danger:#b42318; --danger-soft:#fbe4e1;
  --font-display:"Montserrat",Arial,Helvetica,sans-serif;
  --font-body:"Montserrat",Arial,Helvetica,sans-serif;
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101614; --surface:#171f1b; --surface-2:#1d2722; --ink:#e5ece8; --muted:#9aa9a1; --line:#2b3832;
    --accent:#52b98b; --accent-ink:#08170f; --accent-soft:#1c3a2d;
    --tec:#8db3f2; --tec-soft:#1c2a42; --tac:#f0a274; --tac-soft:#3b281c; --fis:#e392cd; --fis-soft:#38203a;
    --warn:#e2b54a; --danger:#f2897e; --danger-soft:#3e201c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#171f1b; --surface-2:#1d2722; --ink:#e5ece8; --muted:#9aa9a1; --line:#2b3832;
  --accent:#52b98b; --accent-ink:#08170f; --accent-soft:#1c3a2d;
  --tec:#8db3f2; --tec-soft:#1c2a42; --tac:#f0a274; --tac-soft:#3b281c; --fis:#e392cd; --fis-soft:#38203a;
  --warn:#e2b54a; --danger:#f2897e; --danger-soft:#3e201c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.18}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
a{color:var(--accent)}

/* Cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:46px;height:46px;border-radius:9px;background:#3f7d4e;flex:none;display:block}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.brand h1 .ver{font-weight:500;color:var(--accent);margin-left:2px}
.brand .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status[data-k="db"]::before{background:var(--accent)}
.status[data-k="local"]::before{background:var(--warn)}
.status[data-k="memory"]::before,.status[data-k="ro"]::before{background:var(--danger)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;padding:8px 14px;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);background:var(--danger-soft)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{font-size:13px;padding:5px 10px;min-height:32px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* Menús desplegables */
details.menu{position:relative}
details.menu>summary{list-style:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>summary::after{content:"▾";font-size:12px;margin-left:2px}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;display:flex;flex-direction:column;z-index:40}
.menu-pop button{text-align:left;background:none;border:0;padding:9px 10px;border-radius:7px;cursor:pointer;font-size:15px}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop small{display:block;color:var(--muted);font-size:13px}

main{max-width:1400px;margin:0 auto;padding:20px 24px 72px}
.note{background:var(--danger-soft);color:var(--ink);border:1px solid var(--danger);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:15px}

/* Biblioteca */
.list-layout{display:grid;grid-template-columns:262px minmax(0,1fr);gap:24px;align-items:start}
.filters{position:sticky;top:88px;display:flex;flex-direction:column;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;max-height:calc(100vh - 108px);overflow:auto}
.fgroup h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.fchip .cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchip[aria-pressed="true"] .cnt{color:var(--accent-ink);opacity:.85}
.fchip.zero{opacity:.55}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>legend,.lab{font-weight:600;font-size:14px}
.field .help{font-size:13px;color:var(--muted)}
input[type="text"],input[type="search"],input[type="url"],input[type="number"],select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--surface);min-height:40px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:120px;line-height:1.5}
.results-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.results-bar .count{color:var(--muted);font-size:15px}
.results-bar .count strong{color:var(--ink);font-variant-numeric:tabular-nums}
.sortbox{display:flex;align-items:center;gap:8px;font-size:14px}
.sortbox select{width:auto;min-height:36px;padding:5px 9px}
#btnFilters{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--muted);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.thumb{height:170px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.thumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.sport{font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:12px;color:var(--accent)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.pill.ej{border-style:dashed;color:var(--muted);background:transparent}
.card h3{font-size:17px}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fig{background:var(--surface-2);border-radius:8px;padding:6px 9px;display:flex;flex-direction:column;min-width:0}
.fig-n{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig-l{font-size:11.5px;color:var(--muted);line-height:1.25}
.objs{display:flex;flex-wrap:wrap;gap:5px}
.oc{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px}
.oc.tec{background:var(--tec-soft);color:var(--tec)}
.oc.tac{background:var(--tac-soft);color:var(--tac)}
.oc.fis{background:var(--fis-soft);color:var(--fis)}
.oc.more{background:var(--surface-2);color:var(--muted)}
.card-foot{margin-top:auto;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;border-top:1px solid var(--line);padding-top:8px}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:36px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{font-size:21px}
.empty p{color:var(--muted);max-width:52ch}
.skel{height:330px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);border:1px solid var(--line)}

/* Ficha */
.d-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap}
.d-head{margin-bottom:16px;display:flex;flex-direction:column;gap:6px}
.d-head h2{font-size:31px}
.d-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:20px;align-items:start}
.d-board{margin:0;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.d-board svg{width:100%;height:auto;max-height:74vh;display:block}
.d-board img{width:100%;height:auto;display:block;background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;background:var(--surface);border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:20px;height:20px;color:var(--ink);flex:none}
.d-facts{display:flex;flex-direction:column;gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fact h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fact .big{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.fact .sm{font-size:14.5px;color:var(--muted)}
.balance{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);width:max-content}
.d-sec{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.d-sec h3{font-size:19px;margin-bottom:10px}
.prose{white-space:pre-line;max-width:75ch;line-height:1.6}
.omx-wrap{overflow-x:auto}
.omx{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.omx th,.omx td{border-top:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
.omx thead th{border-top:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-bottom:6px}
.omx thead th.tec{color:var(--tec)} .omx thead th.tac{color:var(--tac)}
.omx tbody th{width:26%;font-weight:700;background:var(--surface-2)}
.omx ul{margin:0;padding-left:16px}
.omx li{margin:1px 0}
.omx td:nth-child(2) li::marker{color:var(--tec)} .omx td:nth-child(3) li::marker{color:var(--tac)}
.fis-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fis-list li{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--muted)}
.fis-list li.on{border-color:var(--fis);background:var(--fis-soft);color:var(--ink)}
.fis-list .fis-mark{width:14px;height:14px;border-radius:4px;border:2px solid var(--line);flex:none;margin-top:3px}
.fis-list li.on .fis-mark{background:var(--fis);border-color:var(--fis)}
.fis-list .sm{font-size:13px;color:var(--muted)}
.variants{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:80ch}
.variants li::marker{font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}

/* Editor */
.e-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.e-head h2{font-size:27px}
.eform{display:flex;flex-direction:column;gap:16px}
.esec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.esec>h3{font-size:18px}
.esec>.help{margin-top:-8px;font-size:14px;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:inline-flex;align-items:center;padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.calc{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.calc b{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}
.obj-eds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fis-eds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fis-ed{border:1px solid var(--line);border-top:4px solid var(--fis);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.fis-ed .opt span{width:100%}
.fis-ed .opt input:checked+span{background:var(--fis);border-color:var(--fis);color:var(--surface)}
.fis-ed input[type="text"]{min-height:36px;font-size:14px}
.obj-ed{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;border-top:4px solid currentColor}
.obj-ed.tec{color:var(--tec)} .obj-ed.tac{color:var(--tac)} .obj-ed.fis{color:var(--fis)}
.obj-ed>label{font-family:var(--font-display);font-size:14.5px;font-weight:700}
.obj-ed .chipbox,.obj-ed .sugs{color:var(--ink)}
.chipbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px;min-height:42px;background:var(--surface)}
.chipbox input{border:0;min-height:30px;padding:4px;flex:1;min-width:120px;background:transparent}
.chipbox input:focus{outline:none}
.chipbox:focus-within{border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;padding:3px 4px 3px 9px;border-radius:6px}
.obj-ed.tec .chip{background:var(--tec-soft);color:var(--tec)}
.obj-ed.tac .chip{background:var(--tac-soft);color:var(--tac)}
.obj-ed.fis .chip{background:var(--fis-soft);color:var(--fis)}
.chip button{border:0;background:transparent;cursor:pointer;font-size:16px;line-height:1;padding:0 4px;color:inherit}
.sugs{display:flex;flex-wrap:wrap;gap:5px}
.sug{font-size:13px;border:1px dashed var(--line);background:transparent;border-radius:6px;padding:2px 8px;cursor:pointer;color:var(--muted)}
.sug:hover{border-color:var(--muted);color:var(--ink)}
.var-list{display:flex;flex-direction:column;gap:10px}
.var-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:start}
.var-n{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--accent);text-align:right;padding-top:6px}
.var-row textarea{min-height:58px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;cursor:pointer;font-size:18px;color:var(--muted)}
.icon-btn:hover{color:var(--danger);border-color:var(--danger)}
.err{color:var(--danger);font-size:14px;font-weight:600}
.savebar{position:sticky;bottom:0;z-index:20;display:flex;justify-content:flex-end;gap:10px;padding:12px 0;background:linear-gradient(to top,var(--bg) 70%,transparent);pointer-events:none}
.savebar .btn{pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.12)}

/* Pizarra */
.gtabs{display:flex;gap:6px}
.gtab{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:8px;font-weight:600;cursor:pointer}
.gtab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.g-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.g-top .field{min-width:260px;flex:1;max-width:420px}
.g-hist{display:flex;gap:6px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tool{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:74px;padding:6px 6px 5px;font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;line-height:1.1;text-align:center}
.tool svg{width:24px;height:24px;color:var(--ink)}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.tsep{width:1px;background:var(--line);margin:2px 2px}
.g-props{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:40px;padding:6px 10px;background:var(--surface-2);border-radius:8px;font-size:14px}
.g-props .inline{flex-direction:row;align-items:center;gap:8px}
.g-props .inline input{min-height:32px;padding:4px 8px;width:auto}
.g-props .prop-name{font-weight:700}
.hint{color:var(--muted);font-size:14px}
.board-wrap{border-radius:10px;overflow:hidden;border:1px solid var(--line)}
#edBoard{width:100%;height:auto;max-height:72vh;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#edBoard.mode-sel .el{cursor:grab}
#edBoard.mode-draw{cursor:crosshair}
#edBoard .hdl{cursor:move}
.img-zone{border:1px dashed var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--surface-2)}
.img-zone img{max-width:100%;max-height:60vh;border-radius:6px;background:#fff}

/* Modal y avisos */
.modal{position:fixed;inset:0;background:rgba(10,16,13,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal-box{background:var(--surface);border-radius:12px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-box p{font-size:16px}
.modal-act{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-size:15px;z-index:70;max-width:min(560px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast[data-err="1"]{background:var(--danger);color:#fff}
body.has-selbar .toast{bottom:96px}
body.has-selbar main{padding-bottom:130px}

/* Selección de fichas */
.card{position:relative}
.card .ck{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.94);border:2px solid #ffffff;box-shadow:0 1px 5px rgba(0,0,0,.35);display:grid;place-items:center;z-index:2}
.card[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card[aria-checked="true"] .ck{background:var(--accent);border-color:var(--accent)}
.card[aria-checked="true"] .ck::after{content:"";width:7px;height:13px;border:solid #ffffff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.selbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 34px rgba(0,0,0,.2);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;width:max-content;max-width:calc(100% - 24px)}
.selbar .sc{font-weight:700;font-variant-numeric:tabular-nums}
.selbar .sc small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.selbar .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

@media (max-width:1050px){
  .d-grid{grid-template-columns:1fr}
  .obj-eds,.fis-eds{grid-template-columns:1fr}
  .fis-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .top{position:static;padding:12px 16px}
  main{padding:16px 16px 72px}
  .list-layout{grid-template-columns:1fr}
  .filters{position:static;max-height:none;display:none}
  .filters.open{display:flex}
  #btnFilters{display:inline-flex}
  .row,.row3{grid-template-columns:1fr}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .d-head h2{font-size:25px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 46 46" aria-hidden="true"><rect x="7" y="11" width="32" height="24" fill="none" stroke="#fff" stroke-width="2"/><line x1="23" y1="11" x2="23" y2="35" stroke="#fff" stroke-width="2"/><circle cx="15" cy="19" r="3.2" fill="#d63a2f" stroke="#fff" stroke-width="1"/><circle cx="16" cy="28" r="3.2" fill="#d63a2f" stroke="#fff" stroke-width="1"/><circle cx="30" cy="20" r="3.2" fill="#1f55c9" stroke="#fff" stroke-width="1"/><circle cx="31" cy="29" r="3.2" fill="#1f55c9" stroke="#fff" stroke-width="1"/></svg>
    <div>
      <h1>SSG Data <span class="ver">1.0</span></h1>
      <p class="sub">Base de datos de juegos reducidos para deportes de equipo con balón</p>
    </div>
  </div>
  <div class="top-actions">
    <span id="storeStatus" class="status" data-k="init">Conectando…</span>
    <details class="menu" id="mExport">
      <summary class="btn ghost">Exportar</summary>
      <div class="menu-pop">
        <button type="button" data-exp="pdf">Fichas seleccionadas (PDF)<small>Elige las fichas y descárgalas en un solo PDF</small></button>
        <button type="button" data-exp="json">Base de datos completa (JSON)<small>Copia de seguridad que se puede volver a importar</small></button>
        <button type="button" data-exp="csv">Tabla para Excel (CSV)<small>Una fila por juego, sin gráficos</small></button>
      </div>
    </details>
    <button type="button" class="btn ghost" id="btnImport">Importar</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <button type="button" class="btn primary" id="btnNew">+ Nuevo juego</button>
  </div>
</header>

<main>
  <div id="note" class="note" role="status" hidden></div>

  <section id="viewList" aria-label="Biblioteca">
    <div class="list-layout">
      <aside class="filters" id="filters" aria-label="Filtros">
        <div class="field">
          <label for="q">Buscar</label>
          <input id="q" type="search" placeholder="Título, objetivo, descripción…" autocomplete="off">
        </div>
        <div id="fGroups" style="display:flex;flex-direction:column;gap:18px"></div>
        <button type="button" class="linkbtn" id="btnClear" hidden>Quitar todos los filtros</button>
      </aside>
      <div>
        <div class="results-bar">
          <p class="count" id="resultCount"></p>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <button type="button" class="btn sm" id="btnFilters" aria-controls="filters" aria-expanded="false">Filtros</button>
            <button type="button" class="btn sm" id="btnSelect" aria-pressed="false">Seleccionar fichas</button>
            <div class="sortbox">
              <label for="sort">Ordenar</label>
              <select id="sort">
                <option value="recientes">Modificados recientemente</option>
                <option value="titulo">Título (A–Z)</option>
                <option value="deporte">Deporte</option>
                <option value="tipo">Tipo de tarea</option>
                <option value="espacio">Área por jugador (menor a mayor)</option>
              </select>
            </div>
          </div>
        </div>
        <div id="grid" class="grid" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <section id="viewDetail" aria-label="Ficha del juego" hidden></section>
  <section id="viewEdit" aria-label="Editor del juego" hidden></section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalMsg">
    <p id="modalMsg"></p>
    <div class="modal-act">
      <button type="button" class="btn" id="modalCancel">Cancelar</button>
      <button type="button" class="btn primary" id="modalOk">Aceptar</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="selBar" class="selbar" role="region" aria-label="Fichas seleccionadas" hidden>
  <span class="sc" id="selCount" aria-live="polite"></span>
  <div class="grp">
    <button type="button" class="btn sm" id="selAll">Seleccionar las visibles</button>
    <button type="button" class="btn sm" id="selNone">Quitar selección</button>
  </div>
  <div class="grp">
    <button type="button" class="btn primary" id="selPdf">Exportar PDF</button>
    <button type="button" class="btn" id="selDone">Cerrar</button>
  </div>
</div>

<script>
'use strict';
/* ================= Utilidades ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ const n = typeof v === 'number' ? v : parseFloat(String(v == null ? '' : v).replace(',', '.')); return Number.isFinite(n) ? n : null; }
function clamp(v,a,b){ return Math.min(b, Math.max(a, v)); }
function fmt(n, d=0){ return n == null ? '—' : Number(n).toLocaleString('es-ES', {maximumFractionDigits:d}); }
function normTxt(s){ return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function str(v, max=6000){ return typeof v === 'string' ? v.trim().slice(0, max) : (typeof v === 'number' ? String(v) : ''); }
function nn(v){ const n = num(v); return n == null ? null : clamp(Math.round(n), 0, 99); }
function posnum(v){ const n = num(v); return n != null && n > 0 ? Math.min(500, Math.round(n*100)/100) : null; }
function safeUrl(u){ u = str(u, 2000); if(!u) return ''; try{ const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : ''; }catch(e){ return ''; } }
function f3(n){ return +Number(n).toFixed(4); }
function slug(s){ return normTxt(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'juego'; }

const BAL_ORDER = ['Sin oposición','Igualdad numérica','Superioridad','Inferioridad'];

const GRASS = {color:'#3f7d4e', out:'#33683f', ink:'#ffffff', label:'rgba(255,255,255,.88)', halo:'rgba(0,0,0,.55)', grass:true};
const WOOD = {color:'#d8ab70', out:'#b8894f', ink:'#3b2412', label:'rgba(45,25,10,.85)', halo:'rgba(255,255,255,.75)'};
const FONDOS = {
  rect: Object.assign({nombre:'Espacio rectangular (usa las medidas del juego)'}, GRASS, {draw:(s,L,W)=>`<rect x="0" y="0" width="${f3(L)}" height="${f3(W)}"/>`}),
  futbol: Object.assign({nombre:'Campo de fútbol (105 × 68 m)', L:105, W:68}, GRASS, {draw:s=>`<rect x="0" y="0" width="105" height="68"/><line x1="52.5" y1="0" x2="52.5" y2="68"/><circle cx="52.5" cy="34" r="9.15"/>${spot(52.5,34,s)}${footLeft(s)}${mirror(105, footLeft(s))}`}),

const BM = 44; // margen exterior en unidades de la pizarra

function boardDims(g, esp){
  const f = FONDOS[g && g.fondo] || FONDOS.rect;
  let Lr, Wr;
  if(f.L){ Lr = f.L; Wr = f.W; }
  else { Lr = (esp && posnum(esp.largo)) || 30; Wr = (esp && posnum(esp.ancho)) || 20; }
  const ratio = clamp(Wr / Lr, 0.3, 1.6);
  const FW = 1000, FH = FW * ratio;
  return {f, Lr, Wr, L:Lr, W:Lr*ratio, FW, FH, s:FW/Lr};
}
function layerOf(t){ return t === 'zona' ? 0 : (t === 'cono' || t === 'porteria') ? 1 : LINE_T.has(t) ? 2 : 3; }

function arrowSVG(e, c, hit){
  const x1 = e.x*c.FW, y1 = e.y*c.FH, x2 = e.x2*c.FW, y2 = e.y2*c.FH;
  const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx, dy);
  if(len < 2) return '';
  const ux = dx/len, uy = dy/len, px = -uy, py = ux;
  const hl = Math.min(20, len*0.6), hw = hl*0.55;
  const bx = x2-ux*hl, by = y2-uy*hl;
  const P = (a,b) => `${a.toFixed(1)},${b.toFixed(1)}`;
  const ink = c.ink;
  const head = `<polygon points="${P(x2,y2)} ${P(bx+px*hw, by+py*hw)} ${P(bx-px*hw, by-py*hw)}" fill="${ink}"/>`;
  let body = '';
  if(e.t === 'cond'){
    const zl = len - hl - 10; const pts = [P(x1,y1)]; let d = 10, sg = 1;
    while(d < zl){ const qx = x1+ux*d, qy = y1+uy*d; pts.push(P(qx+px*7*sg, qy+py*7*sg)); sg = -sg; d += 12; }
    pts.push(P(bx,by));
    body = `<polyline points="${pts.join(' ')}" fill="none" stroke="${ink}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  } else if(e.t === 'tiro'){
    const o = 3.6;
    body = `<line x1="${(x1+px*o).toFixed(1)}" y1="${(y1+py*o).toFixed(1)}" x2="${(bx+px*o).toFixed(1)}" y2="${(by+py*o).toFixed(1)}" stroke="${ink}" stroke-width="2.6"/>`+
           `<line x1="${(x1-px*o).toFixed(1)}" y1="${(y1-py*o).toFixed(1)}" x2="${(bx-px*o).toFixed(1)}" y2="${(by-py*o).toFixed(1)}" stroke="${ink}" stroke-width="2.6"/>`;
  } else {
    body = `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" stroke="${ink}" stroke-width="3.2" stroke-linecap="round"${e.t === 'pase' ? ' stroke-dasharray="11 8"' : ''}/>`;
  }
  const hitL = hit ? `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="transparent" stroke-width="26" stroke-linecap="round"/>` : '';
  return hitL + body + head;
}

function elSVG(e, i, c){
  const x = +(e.x*c.FW).toFixed(1), y = +(e.y*c.FH).toFixed(1);
  const live = c.interactive && i >= 0;
  const attrs = i >= 0 ? ` data-i="${i}"${live ? ' class="el"' : ''}` : ' pointer-events="none" opacity="0.8"';
  const hitC = r => live ? `<circle cx="${x}" cy="${y}" r="${r}" fill="transparent"/>` : '';
  if(PLAYER_T.has(e.t)){
    const lab = esc(String(e.l || '').slice(0,3));
    const tc = e.t === 'com' ? '#1e1e1e' : '#ffffff';
    const fs = lab.length > 2 ? 13 : (lab.length > 1 ? 15.5 : 18);
    return `<g${attrs}>${hitC(27)}<circle cx="${x}" cy="${y}" r="17" fill="${COL[e.t]}" stroke="#ffffff" stroke-width="3"/>`+
      (lab ? `<text x="${x}" y="${y}" dy="0.36em" text-anchor="middle" font-family="${FONT}" font-size="${fs}" font-weight="700" fill="${tc}">${lab}</text>` : '') + `</g>`;
  }
  switch(e.t){
    case 'balon': return `<g${attrs}>${hitC(20)}<circle cx="${x}" cy="${y}" r="8.5" fill="#ffffff" stroke="#151515" stroke-width="2.5"/><circle cx="${x}" cy="${y}" r="3" fill="#151515"/></g>`;
    case 'cono': return `<g${attrs}>${hitC(20)}<path d="M${x} ${(y-13).toFixed(1)} L${(x+11).toFixed(1)} ${(y+10).toFixed(1)} L${(x-11).toFixed(1)} ${(y+10).toFixed(1)} Z" fill="#ff8a1f" stroke="#7a3a00" stroke-width="2" stroke-linejoin="round"/></g>`;
    case 'porteria': {
      const w = e.rot ? 64 : 14, h = e.rot ? 14 : 64;
      return `<g${attrs}>${live ? `<rect x="${x-w/2-9}" y="${y-h/2-9}" width="${w+18}" height="${h+18}" fill="transparent"/>` : ''}<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" fill="rgba(255,255,255,.35)" stroke="${c.ink}" stroke-width="3.5"/></g>`;
    }
    case 'texto': {
      const t = esc(String(e.l || '').slice(0,40));
      const wh = Math.max(34, String(e.l || '').length*12 + 18);
      return `<g${attrs}>${live ? `<rect x="${(x-wh/2).toFixed(1)}" y="${y-19}" width="${wh}" height="38" fill="transparent"/>` : ''}<text x="${x}" y="${y}" dy="0.36em" text-anchor="middle" font-family="${FONT}" font-size="24" font-weight="700" fill="${c.ink}" stroke="${c.halo}" stroke-width="4" stroke-linejoin="round" paint-order="stroke">${t}</text></g>`;
    }
    case 'zona': {
      const x2 = e.x2*c.FW, y2 = e.y2*c.FH;
      const rx = Math.min(x,x2), ry = Math.min(y,y2), w = Math.abs(x2-x), h = Math.abs(y2-y);
      return `<g${attrs}><rect x="${rx.toFixed(1)}" y="${ry.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="rgba(255,225,77,.2)" stroke="rgba(255,225,77,.95)" stroke-width="3" stroke-dasharray="12 8"/></g>`;
    }
    default: return LINE_T.has(e.t) ? `<g${attrs}>${arrowSVG(e, c, live)}</g>` : '';
  }
}
function selSVG(e, c){
  const Y = '#ffe14d', x = e.x*c.FW, y = e.y*c.FH;
  if(LINE_T.has(e.t) || e.t === 'zona'){
    const hd = (hx, hy, k) => `<circle data-h="${k}" class="hdl" cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="11" fill="${Y}" stroke="#111" stroke-width="2.5"/>`;
    return hd(x, y, 1) + hd(e.x2*c.FW, e.y2*c.FH, 2);
  }
  const r = e.t === 'porteria' ? 42 : (e.t === 'texto' ? 30 : 27);
  return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="none" stroke="${Y}" stroke-width="3" stroke-dasharray="7 5" pointer-events="none"/>`;
}
function boardParts(g, esp, opt={}){
  const d = boardDims(g, esp);
  const {f, FW, FH, s} = d, M = BM;
  const c = {FW, FH, ink:f.ink, halo:f.halo, interactive:!!opt.interactive};
  let h = `<rect x="${-M}" y="${-M}" width="${FW+2*M}" height="${(FH+2*M).toFixed(1)}" fill="${f.out}"/><rect x="0" y="0" width="${FW}" height="${FH.toFixed(1)}" fill="${f.color}"/>`;
  if(f.grass){ const n = 10, w = FW/n; for(let k = 0; k < n; k += 2) h += `<rect x="${(k*w).toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${FH.toFixed(1)}" fill="#ffffff" fill-opacity="0.045"/>`; }
  h += `<g transform="scale(${f3(s)})" fill="none" stroke="${f.ink}" color="${f.ink}" stroke-width="${f3(3/s)}" stroke-linejoin="round" pointer-events="none">${f.draw(s, d.L, d.W)}</g>`;
  if(!opt.thumb){
    h += `<g font-family="${FONT}" font-size="21" font-weight="600" fill="${f.label}" text-anchor="middle" pointer-events="none"><text x="${FW/2}" y="${-M/2}" dy="0.36em">${esc(fmt(d.Lr,2))} m</text><text transform="translate(${-M/2} ${(FH/2).toFixed(1)}) rotate(-90)" dy="0.36em">${esc(fmt(d.Wr,2))} m</text></g>`;
  }
  const els = (g && Array.isArray(g.elementos)) ? g.elementos : [];
  const order = els.map((e, i) => i).sort((a, b) => (layerOf(els[a].t) - layerOf(els[b].t)) || (a - b));
  for(const i of order) h += elSVG(els[i], i, c);
  if(opt.draft) h += elSVG(opt.draft, -1, c);
  if(opt.sel != null && opt.sel >= 0 && els[opt.sel]) h += selSVG(els[opt.sel], c);
  return {vb:`${-M} ${-M} ${FW+2*M} ${(FH+2*M).toFixed(1)}`, inner:h, d};
}
function boardSVG(g, esp, opt={}){
  const p = boardParts(g, esp, opt);
  return `<svg viewBox="${p.vb}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(opt.label || 'Representación gráfica del juego')}">${p.inner}</svg>`;
}

    case 'cond': return v(`<polyline points="3,14 5.5,10 8.5,18 11.5,10 14.5,18 17.5,14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>${head}`);
    case 'tiro': return v(`<line x1="3" y1="11.6" x2="18" y2="11.6" stroke="currentColor" stroke-width="2"/><line x1="3" y1="16.4" x2="18" y2="16.4" stroke="currentColor" stroke-width="2"/>${head}`);
    case 'zona': return v('<rect x="4" y="6" width="20" height="16" fill="rgba(242,193,48,.3)" stroke="#c99a10" stroke-width="2" stroke-dasharray="4 3"/>');
    case 'texto': return v('<text x="14" y="20.5" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="currentColor">T</text>');

  return v('');
}

/* ================= Modelo de datos ================= */
function arrStr(v, maxLen=200, maxN=40){ return Array.isArray(v) ? v.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim().slice(0, maxLen)).slice(0, maxN) : []; }
function normEls(a){
  if(!Array.isArray(a)) return [];
  const out = [];
  for(const e of a.slice(0, 250)){
    if(!e || typeof e !== 'object' || !EL_NOMBRE[e.t]) continue;
    const c = v => { const n = num(v); return n == null ? 0.5 : clamp(n, -0.2, 1.2); };
    const o = {t:e.t, x:c(e.x), y:c(e.y)};
    if(LINE_T.has(e.t) || e.t === 'zona'){ o.x2 = c(e.x2); o.y2 = c(e.y2); }
    if(PLAYER_T.has(e.t) || e.t === 'texto') o.l = str(e.l, e.t === 'texto' ? 40 : 3);
    if(e.t === 'porteria') o.rot = e.rot ? 1 : 0;
    out.push(o);
  }
  return out;
}
function normObjCat(o, ck){
  const out = {}; ROLES.forEach(r => { out[r.k] = []; });
  if(Array.isArray(o)){
    const sc = [];
    for(const v of arrStr(o, 80, 40)){ const role = LEGACY[ck][normTxt(v)]; (role ? out[role] : sc).push(v); }
    if(sc.length) out.sinClasificar = sc;
  } else if(o && typeof o === 'object'){
    ROLES.forEach(r => { out[r.k] = arrStr(o[r.k], 80, 25); });
    const sc = arrStr(o.sinClasificar, 80, 40); if(sc.length) out.sinClasificar = sc;
  }
  return out;
}
function normFis(o){
  const out = {}; FIS.forEach(f => { out[f.k] = {on:false, detalle:''}; });
  if(Array.isArray(o)){
    for(const v of arrStr(o, 80, 40)){
      const k = LEGACY.fisicos[normTxt(v)] || 'especifica', f = FIS.find(x => x.k === k);
      out[k].on = true;
      if(normTxt(v) !== normTxt(f.nombre)) out[k].detalle = [out[k].detalle, v].filter(Boolean).join(', ').slice(0, 200);
    }
  } else if(o && typeof o === 'object'){
    FIS.forEach(f => { const x = o[f.k]; if(x === true) out[f.k].on = true; else if(x && typeof x === 'object'){ out[f.k].detalle = str(x.detalle, 200); out[f.k].on = x.on === true || !!out[f.k].detalle; } });
  }
  return out;
}
function normItem(id, d){
  d = d && typeof d === 'object' ? d : {};
  const o = d.objetivos || {}, r = d.relacion || {}, e = d.espacio || {}, g = d.grafico || {};
  return {
    id,
    titulo: str(d.titulo, 160),
    deporte: str(d.deporte, 60),
    tipoTarea: str(d.tipoTarea, 60),
    metodos: arrStr(d.metodos, 60, 10),
    objetivos: {tecnicos: normObjCat(o.tecnicos, 'tecnicos'), tacticos: normObjCat(o.tacticos, 'tacticos'), fisicos: normFis(o.fisicos)},
    relacion: {atacantes: nn(r.atacantes), defensores: nn(r.defensores), comodines: nn(r.comodines), porteros: nn(r.porteros), nota: str(r.nota, 200)},
    espacio: {largo: posnum(e.largo), ancho: posnum(e.ancho), descripcion: str(e.descripcion, 300)},
    descripcion: str(d.descripcion, 8000),
    grafico: {
      modo: g.modo === 'imagen' ? 'imagen' : 'pizarra',
      fondo: FONDOS[g.fondo] ? g.fondo : 'rect',
      elementos: normEls(g.elementos),
      imagen: (typeof g.imagen === 'string' && g.imagen.length < 400000 && IMG_RE.test(g.imagen)) ? g.imagen : ''
    },
    video: safeUrl(d.video),
    variantes: arrStr(d.variantes, 1500, 30),
    ejemplo: d.ejemplo === true,
    creado: str(d.creado, 40),
    actualizado: str(d.actualizado, 40)
  };
}
function copyObjCat(o){ const out = {}; ROLES.forEach(r => { out[r.k] = (o[r.k] || []).slice(); }); if(o.sinClasificar && o.sinClasificar.length) out.sinClasificar = o.sinClasificar.slice(); return out; }
function toDoc(it){
  const r4 = n => Math.round(n*10000)/10000;
  return {
    titulo: it.titulo, deporte: it.deporte, tipoTarea: it.tipoTarea, metodos: it.metodos.slice(),
    objetivos: {tecnicos: copyObjCat(it.objetivos.tecnicos), tacticos: copyObjCat(it.objetivos.tacticos), fisicos: Object.fromEntries(FIS.map(f => [f.k, {on: !!it.objetivos.fisicos[f.k].on, detalle: it.objetivos.fisicos[f.k].detalle || ''}]))},
    relacion: Object.assign({}, it.relacion), espacio: Object.assign({}, it.espacio),
    descripcion: it.descripcion,
    grafico: {modo: it.grafico.modo, fondo: it.grafico.fondo, imagen: it.grafico.imagen || '',
      elementos: it.grafico.elementos.map(e => { const o = Object.assign({}, e); ['x','y','x2','y2'].forEach(k => { if(typeof o[k] === 'number') o[k] = r4(o[k]); }); return o; })},
    video: it.video, variantes: it.variantes.slice(), ejemplo: !!it.ejemplo,
    creado: it.creado, actualizado: it.actualizado
  };
}
function relTxt(r){
  const a = r.atacantes, d = r.defensores, c = r.comodines;
  if(a == null && d == null) return '';
  let s = `${a == null ? 0 : a} x ${d == null ? 0 : d}`;
  if(c) s += ` + ${c}`;
  return s;
}
function balance(r){
  const a = r.atacantes || 0, d = r.defensores || 0, c = r.comodines || 0;
  if(!a && !d && !c) return null;
  if(d === 0) return {txt:'Sin oposición', det:''};
  const ef = a + c;
  if(ef > d) return {txt:'Superioridad', det:`${ef} contra ${d} en ataque`};
  if(ef < d) return {txt:'Inferioridad', det:`${ef} contra ${d} en ataque`};
  return {txt:'Igualdad numérica', det:`${ef} contra ${d}`};
}
function espacioInfo(it){
  const L = it.espacio.largo, W = it.espacio.ancho;
  if(!L || !W) return null;
  const r = it.relacion, n = (r.atacantes || 0) + (r.defensores || 0) + (r.comodines || 0);
  return {L, W, area: L*W, n, porJug: n ? (L*W)/n : null};
}
function porterosTxt(n){ return n ? `${n} portero${n > 1 ? 's' : ''}` : ''; }
function useImage(it){ return it.grafico.modo === 'imagen' && !!it.grafico.imagen; }

/* ================= Estado y almacenamiento ================= */
const S = {items:[], loaded:false, fresh:false, mode:'init', readOnly:false, view:'list', currentId:null, note:'',
  filters:{q:'', deporte:new Set(), tipo:new Set(), metodo:new Set(), otec:new Set(), otac:new Set(), ofis:new Set(), rel:new Set()}, sort:'recientes',
  selMode:false, sel:new Set(), busy:false};
const caps = {db:null, user:null, downloads:null, inArtifact: !!(window.claude && typeof window.claude.use === 'function')};
const LS_KEY = 'ssg-biblioteca-v1';
let ed = null;

function newId(){
  if(S.mode === 'db' && caps.db){ try{ return caps.db.collection('ssg').doc().id; }catch(e){} }
  return 'ssg-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
}
function startLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    S.items = (Array.isArray(arr) ? arr : []).filter(d => d && typeof d === 'object').map(d => normItem(ID_RE.test(d.id || '') ? d.id : newId(), d));
    S.mode = 'local';
  }catch(e){ S.mode = 'memory'; S.items = []; }
  S.loaded = true; S.fresh = true;
}
function persistLocal(){
  if(S.mode !== 'local') return;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S.items.map(it => Object.assign({id:it.id}, toDoc(it))))); }
  catch(e){ toast('No se pudo guardar en este navegador (espacio lleno). Exporta la biblioteca en JSON.', true); }
}
function subscribe(){
  let timer = setTimeout(() => {
    if(S.fresh) return;
    S.note = S.items.length ? 'No se puede confirmar la conexión con la base de datos: lo que ves puede no estar actualizado.' : 'No se puede acceder a la base de datos todavía. Comprueba la conexión; la página sigue intentándolo.';
    S.loaded = true; renderAll();
  }, 10000);
  caps.db.collection('ssg').onSnapshot(snap => {
    S.items = snap.docs.filter(d => d.exists).map(d => normItem(d.id, d.data()));
    S.loaded = true;
    if(!snap.metadata.fromCache){ S.fresh = true; clearTimeout(timer); S.note = ''; }
    renderAll();
  }, err => {
    clearTimeout(timer); S.loaded = true; S.fresh = true;
    S.note = (err && err.code === 'revoked') ? 'La base de datos ya no está disponible en esta vista.' : `No se pudo leer la base de datos (${(err && err.code) || 'error'}).`;
    renderAll();
  });
}
function handleWriteErr(e){
  const code = e && e.code;
  if(code === 'invalid_argument'){ S.readOnly = true; toast('No tienes permiso para modificar esta biblioteca. Se muestra en modo lectura.', true); renderAll(); }
  else if(code === 'quota_exceeded') toast('La base de datos está llena: elimina juegos o imágenes grandes para poder guardar más.', true);
  else if(code === 'resource_exhausted') toast('Demasiadas operaciones seguidas. Espera unos segundos y vuelve a intentarlo.', true);
  else toast(`No se pudo guardar (${code || 'error'}). Inténtalo de nuevo.`, true);
}
async function dbWrite(fn){
  try{ await fn(); return true; }
  catch(e){
    if(e && e.code === 'unavailable'){
      await new Promise(r => setTimeout(r, 600 + Math.random()*900));
      try{ await fn(); return true; }catch(e2){ handleWriteErr(e2); return false; }
    }
    handleWriteErr(e); return false;
  }
}
function upsertLocal(it){
  const fresh = normItem(it.id, toDoc(it));
  const i = S.items.findIndex(x => x.id === it.id);
  if(i >= 0) S.items[i] = fresh; else S.items.push(fresh);
}
async function saveItem(it, {quiet=false}={}){
  const doc = toDoc(it);
  const bytes = new TextEncoder().encode(JSON.stringify(doc)).length;
  if(bytes > 240000){ toast('La ficha ocupa demasiado (sobre todo la imagen). Usa una imagen más pequeña o la pizarra.', true); return false; }
  if(S.mode === 'db'){
    const ok = await dbWrite(() => caps.db.collection('ssg').doc(it.id).set(doc));
    if(!ok) return false;
  }
  upsertLocal(it); persistLocal();
  if(!quiet) renderAll();
  return true;
}
async function deleteItem(id){
  if(S.mode === 'db'){
    const ok = await dbWrite(() => caps.db.collection('ssg').doc(id).delete());
    if(!ok) return false;
  }
  S.items = S.items.filter(x => x.id !== id); persistLocal(); return true;
}

/* ================= Biblioteca ================= */
const FGROUPS = [
  {k:'deporte', nombre:'Deporte'}, {k:'tipo', nombre:'Tipo de tarea'}, {k:'metodo', nombre:'Método'},
  {k:'otec', nombre:'Objetivos técnicos'}, {k:'otac', nombre:'Objetivos tácticos'}, {k:'ofis', nombre:'Condición física'}, {k:'rel', nombre:'Relación numérica'}
];
function valuesOf(it, k){
  switch(k){
    case 'deporte': return it.deporte ? [it.deporte] : [];
    case 'tipo': return it.tipoTarea ? [it.tipoTarea] : [];
    case 'metodo': return it.metodos;
    case 'otec': case 'otac': { const o = it.objetivos[k === 'otec' ? 'tecnicos' : 'tacticos']; return rolesOf(o).filter(r => (o[r.k] || []).length).map(r => r.corto); }
    case 'ofis': return fisOn(it).map(f => f.nombre);
    case 'rel': { const b = balance(it.relacion); return b ? [b.txt] : []; }
  }
  return [];
}
function groupValues(k){
  const counts = new Map();
  for(const it of S.items) for(const v of valuesOf(it, k)) counts.set(v, (counts.get(v) || 0) + 1);
  let base = [];
  if(k === 'tipo') base = TIPOS.slice();
  if(k === 'metodo') base = METODOS.slice();
  if(k === 'otec' || k === 'otac') base = ROLES.map(r => r.corto);
  if(k === 'ofis') base = FIS.map(f => f.nombre);
  if(k === 'rel') base = BAL_ORDER.slice();
  const extra = [...counts.keys()].filter(v => !base.includes(v));
  if(k === 'deporte') extra.sort((a, b) => (counts.get(b) - counts.get(a)) || a.localeCompare(b, 'es'));
  else extra.sort((a, b) => a.localeCompare(b, 'es'));
  return base.concat(extra).map(v => ({v, n: counts.get(v) || 0}));
}
function searchBlob(it){
  return normTxt([it.titulo, it.deporte, it.tipoTarea, it.metodos.join(' '), objFlat(it, 'tecnicos').map(o => o.v).join(' '), objFlat(it, 'tacticos').map(o => o.v).join(' '),
    fisOn(it).map(f => f.nombre + ' ' + it.objetivos.fisicos[f.k].detalle).join(' '), it.descripcion, it.variantes.join(' '), it.espacio.descripcion, it.relacion.nota, relTxt(it.relacion)].join(' '));
}
function passes(it){
  const F = S.filters;
  for(const g of FGROUPS){ const set = F[g.k]; if(set.size && !valuesOf(it, g.k).some(v => set.has(v))) return false; }
  if(F.q){ const blob = searchBlob(it); if(!normTxt(F.q).split(/\s+/).filter(Boolean).every(w => blob.includes(w))) return false; }
  return true;
}
function activeFilterCount(){ return FGROUPS.reduce((n, g) => n + S.filters[g.k].size, 0) + (S.filters.q ? 1 : 0); }
function sortItems(list){
  const t = it => (it.titulo || '').toLocaleLowerCase('es');
  const by = {
    recientes: (a, b) => (b.actualizado || '').localeCompare(a.actualizado || '') || t(a).localeCompare(t(b), 'es'),
    titulo: (a, b) => t(a).localeCompare(t(b), 'es'),
    deporte: (a, b) => (a.deporte || '~').localeCompare(b.deporte || '~', 'es') || t(a).localeCompare(t(b), 'es'),
    tipo: (a, b) => { const ia = TIPOS.indexOf(a.tipoTarea), ib = TIPOS.indexOf(b.tipoTarea); return ((ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib)) || t(a).localeCompare(t(b), 'es'); },
    espacio: (a, b) => { const pa = (espacioInfo(a) || {}).porJug, pb = (espacioInfo(b) || {}).porJug; return ((pa == null ? 1e9 : pa) - (pb == null ? 1e9 : pb)) || t(a).localeCompare(t(b), 'es'); }
  };
  return list.slice().sort(by[S.sort] || by.recientes);
}
function renderFilters(){
  const box = $('#fGroups');
  box.innerHTML = FGROUPS.map(g => {
    const vals = groupValues(g.k);
    if(!vals.length) return '';
    return `<div class="fgroup"><h3>${esc(g.nombre)}</h3><div class="fchips">${vals.map(o =>
      `<button type="button" class="fchip${o.n ? '' : ' zero'}" data-g="${g.k}" data-v="${esc(o.v)}" aria-pressed="${S.filters[g.k].has(o.v)}">${esc(o.v)} <span class="cnt">${o.n}</span></button>`).join('')}</div></div>`;
  }).join('');
  const n = activeFilterCount();
  $('#btnClear').hidden = n === 0;
  $('#btnFilters').textContent = n ? `Filtros (${n})` : 'Filtros';
}
function objChips(it, max=5){
  const all = [];
  CATS.forEach(c => objFlat(it, c.k).forEach(o => all.push({v:o.v, cls:c.cls, t:`${c.titulo} · ${o.r.nombre}`})));
  fisOn(it).forEach(f => all.push({v:f.nombre, cls:'fis', t:'Condición física' + (it.objetivos.fisicos[f.k].detalle ? ' · ' + it.objetivos.fisicos[f.k].detalle : '')}));
  const shown = all.slice(0, max).map(o => `<span class="oc ${o.cls}" title="${esc(o.t)}">${esc(o.v)}</span>`).join('');
  return shown + (all.length > max ? `<span class="oc more">+${all.length - max}</span>` : '');
}

    </div>
  </article>`;
}
function renderList(){
  const grid = $('#grid');
  if(!S.loaded){ grid.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; $('#resultCount').textContent = 'Cargando la biblioteca…'; $('#fGroups').innerHTML = ''; return; }

function renderAllChips(){ CATS.forEach(c => rolesOf(ed.item.objetivos[c.k]).forEach(r => renderChips(c.k, r.k))); }

function addObj(gk, v){

function toolHint(t){

function pushHist(){ ed.hist.push(JSON.stringify(ed.item.grafico.elementos)); if(ed.hist.length > 60) ed.hist.shift(); ed.dirty = true; }
function undo(){ if(!ed.hist.length) return; ed.item.grafico.elementos = JSON.parse(ed.hist.pop()); ed.sel = -1; renderEditorBoard(); renderProps(); }
function localPt(ev){
  const svg = $('#edBoard'), m = svg.getScreenCTM(), d = ed.dims;
  if(!m || !d) return {x:0.5, y:0.5};
  const q = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse());
  return {x: clamp(q.x/d.FW, -40/d.FW, 1 + 40/d.FW), y: clamp(q.y/d.FH, -40/d.FH, 1 + 40/d.FH)};
}
function nextLabel(t){
  if(t === 'com') return 'C'; if(t === 'por') return 'P';
  const used = new Set(ed.item.grafico.elementos.filter(e => e.t === t).map(e => e.l));
  let n = 1; while(used.has(String(n))) n++; return String(n);
}
function makeEl(t, p){
  const e = {t, x:p.x, y:p.y};
  if(PLAYER_T.has(t)) e.l = nextLabel(t);
  if(t === 'texto') e.l = (ed.texto || 'Texto').slice(0, 40);
  if(t === 'porteria') e.rot = 0;

}
function boardDown(ev){
  if(ev.button != null && ev.button > 0) return;
  const svg = $('#edBoard'), p = localPt(ev), els = ed.item.grafico.elementos, t = ed.tool;
  if(t === 'sel'){
    const h = ev.target.closest('[data-h]'), g = ev.target.closest('[data-i]');
    if(h && ed.sel >= 0){ pushHist(); ed.drag = {mode:'h', h:h.dataset.h, moved:false}; }
    else if(g){ const i = +g.dataset.i; ed.sel = i; pushHist(); ed.drag = {mode:'move', i, start:p, orig:Object.assign({}, els[i]), moved:false}; renderProps(); }
    else { if(ed.sel !== -1){ ed.sel = -1; renderProps(); } renderEditorBoard(); return; }
  } else if(POINT_T.has(t)){
    pushHist(); els.push(makeEl(t, p)); ed.sel = els.length - 1;

}
function boardMove(ev){
  if(!ed || (!ed.drag && !ed.draft)) return;
  const p = localPt(ev), els = ed.item.grafico.elementos;
  if(ed.draft){ ed.draft.x2 = p.x; ed.draft.y2 = p.y; }
  else if(ed.drag.mode === 'move'){
    const e = els[ed.drag.i], o = ed.drag.orig, dx = p.x - ed.drag.start.x, dy = p.y - ed.drag.start.y;
    if(Math.abs(dx) + Math.abs(dy) > 0.002) ed.drag.moved = true;
    e.x = o.x + dx; e.y = o.y + dy;
    if('x2' in o){ e.x2 = o.x2 + dx; e.y2 = o.y2 + dy; }
  } else if(ed.drag.mode === 'h'){
    const e = els[ed.sel]; if(!e) return; ed.drag.moved = true;
    if(ed.drag.h === '1'){ e.x = p.x; e.y = p.y; } else { e.x2 = p.x; e.y2 = p.y; }
  }

}
function boardUp(){

    if(ok){

async function compressImage(file){
  const url = URL.createObjectURL(file);

    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let max = 1200, q = 0.82;
    for(let k = 0; k < 7; k++){
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.naturalWidth*sc)); cv.height = Math.max(1, Math.round(img.naturalHeight*sc));
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
      const out = cv.toDataURL('image/jpeg', q);
      if(out.length < 190000) return out;
      max = Math.round(max*0.8); q = Math.max(0.5, q - 0.07);
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}

const PDFC = {accent:[23,101,74], ink:[23,33,28], muted:[90,103,97], line:[214,221,216], soft:[245,247,245], tec:[42,93,176], tac:[169,77,27], fis:[139,47,115], fisSoft:[244,226,239]};

function pdfTxt(s){
  let t = String(s == null ? '' : s).replace(/[   \t]/g, ' ');
  if(!PDF_UNI){ // sin fuente incrustada solo hay Latin-1
    t = t.replace(/[‘’‚′]/g, "'").replace(/[“”„″]/g, '"').replace(/[–—−]/g, '-')
      .replace(/…/g, '...').replace(/[•●]/g, '·').replace(/→/g, '->').replace(/←/g, '<-')
      .replace(/≤/g, '<=').replace(/≥/g, '>=').replace(/€/g, 'EUR').replace(/[^\n\x20-\x7E\xA0-\xFF]/g, '');
    return t;
  }
  return Array.from(t).filter(c => PDF_CHARS.test(c)).join('');

    String(s).split('\n').forEach((p, pi) => {
      if(pi) R.y += 1.2;

async function buildPDF(items, onProgress){
  const JsPDF = window.jspdf && window.jspdf.jsPDF;
  if(!JsPDF) throw new Error('nolib');
  const doc = new JsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
  const scratch = new JsPDF({unit:'mm', format:'a4', orientation:'portrait'});
  PDF_UNI = registerPdfFonts(doc) && registerPdfFonts(scratch);
  const {PW, PH, M, BOT} = PDF_PAGE, CW = PW - 2*M;
  const many = items.length > 1;
  doc.setProperties({title: many ? 'SSG Data 1.0 · Fichas seleccionadas' : pdfTxt(items[0].titulo || 'Ficha'), subject:'Juegos reducidos (SSG)', creator:'SSG Data 1.0'});
  const idxPages = many ? Math.ceil(items.length / IDX_PER_PAGE) : 0;
  for(let k = 1; k < idxPages; k++) doc.addPage();
  const R = pdfRenderer(doc, BOT), Q = pdfRenderer(scratch, 1e9);
  const {font, T, lines} = R;
  const starts = [];
  for(let i = 0; i < items.length; i++){
    const it = items[i];
    if(onProgress) onProgress(i + 1, items.length);
    if(i > 0 || idxPages) doc.addPage();
    R.y = M; R.cur = it.titulo || 'Sin título';
    starts.push(doc.getNumberOfPages());
    R.header(it);
    let r = null; try{ r = await rasterFor(it); }catch(e){ r = null; }
    if(r){
      // Se mide el resto de la ficha para que, si cabe, quede en una sola página reduciendo el gráfico
      Q.y = 0; if(!useImage(it)) Q.legend(it); Q.y += 2; Q.body(it);
      const avail = BOT - R.y - 2.5 - Q.y - 6;
      let ih = Math.min(CW*r.h/r.w, 112);
      if(ih > avail && avail >= 68) ih = avail;
      let iw = ih*r.w/r.h; if(iw > CW){ iw = CW; ih = iw*r.h/r.w; }
      R.need(ih + 2); const ix = M + (CW - iw)/2;
      doc.addImage(r.data, 'JPEG', ix, R.y, iw, ih, undefined, 'FAST');
      doc.setDrawColor(...PDFC.line); doc.setLineWidth(0.25); doc.rect(ix, R.y, iw, ih);
      R.y += ih + 2.5;
      if(!useImage(it)) R.legend(it);
    }
    R.y += 2;
    R.body(it);
  }
  if(idxPages){
    const fecha = new Date().toLocaleDateString('es-ES', {day:'numeric', month:'long', year:'numeric'});
    const rowH = 11.5;
    for(let p = 0; p < idxPages; p++){
      doc.setPage(p + 1); let y = M;
      if(p === 0){
        font(8.4, 'bold', PDFC.accent); T('SSG DATA 1.0', M, y, {charSpace:0.25}); y += 6;
        font(22, 'bold'); T('Fichas seleccionadas', M, y); y += 11;
        font(9.6, 'normal', PDFC.muted); T(pdfTxt(`${items.length} fichas · exportadas el ${fecha}`), M, y); y += 10;
      } else { font(8, 'italic', PDFC.muted); T('Índice (continuación)', M, y); y += 8; }
      doc.setDrawColor(...PDFC.line); doc.setLineWidth(0.25); doc.line(M, y, M + CW, y);
      items.slice(p*IDX_PER_PAGE, (p + 1)*IDX_PER_PAGE).forEach((it, k) => {
        const i = p*IDX_PER_PAGE + k, pg = starts[i];
        font(9.2, 'bold', PDFC.muted); T(String(i + 1).padStart(2, '0'), M, y + 2.2);
        font(10, 'bold'); const tl = lines(it.titulo || 'Sin título', CW - 34);
        T(tl[0] + (tl.length > 1 ? '…' : ''), M + 10, y + 1.8);
        const sub = [it.deporte, it.tipoTarea, relTxt(it.relacion), espacioInfo(it) ? `${fmt(it.espacio.largo,1)} × ${fmt(it.espacio.ancho,1)} m` : ''].filter(Boolean).join('  ·  ');
        font(8.2, 'normal', PDFC.muted); T(lines(sub, CW - 34)[0] || '', M + 10, y + 6.6);
        font(9.2, 'bold', PDFC.accent); T(String(pg), M + CW, y + 2.2, {align:'right'});
        doc.link(M, y, CW, rowH, {pageNumber: pg});
        y += rowH; doc.setDrawColor(...PDFC.line); doc.line(M, y, M + CW, y);
      });
    }
  }
  const N = doc.getNumberOfPages();
  for(let p = 1; p <= N; p++){
    doc.setPage(p);
    doc.setDrawColor(...PDFC.line); doc.setLineWidth(0.25); doc.line(M, PH - 14, M + CW, PH - 14);
    font(7.4, 'normal', PDFC.muted);
    T('SSG Data 1.0', M, PH - 12);
    T(`Página ${p} de ${N}`, M + CW, PH - 12, {align:'right'});
  }
  return doc.output('blob');
}
async function exportPDF(items, btn){
  if(S.busy) return;
  if(!(window.jspdf && window.jspdf.jsPDF)){ toast('No se pudo cargar el generador de PDF. Comprueba la conexión y recarga la página.', true); return; }
  S.busy = true;
  const orig = btn ? btn.textContent : '';
  if(btn) btn.disabled = true;
  if(!btn) toast('Generando el PDF…');
  try{
    const blob = await buildPDF(items, (i, n) => { if(btn) btn.textContent = `Generando ${i} de ${n}…`; });
    const name = items.length === 1 ? `ficha-${slug(items[0].titulo)}.pdf` : `ssg-data-fichas-${new Date().toISOString().slice(0, 10)}.pdf`;
    await offerDownload(name, blob);
  } catch(e){ toast('No se pudo generar el PDF. Inténtalo de nuevo.', true); }
  finally { S.busy = false; if(btn){ btn.disabled = false; btn.textContent = orig; } renderSelBar(); }
}
async function importFile(file){
  let j;
  try{ j = JSON.parse(await file.text()); }catch(e){ toast('El archivo no es un JSON válido.', true); return; }
  const arr = Array.isArray(j) ? j : (j && Array.isArray(j.juegos) ? j.juegos : null);
  if(!arr || !arr.length){ toast('El archivo no contiene juegos para importar.', true); return; }
  const items = arr.filter(d => d && typeof d === 'object').map(d => normItem(typeof d.id === 'string' && ID_RE.test(d.id) && d.id !== '.' && d.id !== '..' ? d.id : newId(), d));
  const clash = items.filter(it => S.items.some(x => x.id === it.id)).length;
  const msg = `Se importarán ${items.length} juego${items.length > 1 ? 's' : ''}.` + (clash ? ` ${clash} ya existe${clash > 1 ? 'n' : ''} en la biblioteca y se sustituirá${clash > 1 ? 'n' : ''} por la versión del archivo.` : '');
  if(!(await confirmDialog(msg, 'Importar'))) return;
  let ok = 0;
  for(const it of items){
    if(!it.actualizado) it.actualizado = new Date().toISOString();
    if(await saveItem(it, {quiet:true})) ok++; else if(S.readOnly) break;
  }
  renderAll(); toast(`Importados ${ok} de ${items.length} juegos.`, ok < items.length);
}

/* ================= Modal, avisos y vistas ================= */
function confirmDialog(msg, okLabel='Aceptar', danger=false){
  return new Promise(res => {
    const m = $('#modal'), okb = $('#modalOk'), cb = $('#modalCancel'), prev = document.activeElement;
    $('#modalMsg').textContent = msg; okb.textContent = okLabel; okb.className = 'btn ' + (danger ? 'danger-solid' : 'primary');
    m.hidden = false; okb.focus();
    const done = v => { m.hidden = true; okb.onclick = cb.onclick = m.onkeydown = m.onclick = null; if(prev && prev.focus) prev.focus(); res(v); };
    okb.onclick = () => done(true); cb.onclick = () => done(false);
    m.onclick = ev => { if(ev.target === m) done(false); };
    m.onkeydown = ev => { if(ev.key === 'Escape') done(false); };
  });
}

    $('#mExport').open = false;
    if(!S.items.length){ toast('La biblioteca está vacía: no hay nada que exportar.', true); return; }
    if(b.dataset.exp === 'pdf'){ if(!S.selMode) setSelMode(true); else if(S.view !== 'list'){ S.view = 'list'; showView(); renderList(); } window.scrollTo(0, 0); toast('Toca las fichas que quieras incluir y pulsa «Exportar PDF».'); return; }
    const d = new Date().toISOString().slice(0, 10);
    if(b.dataset.exp === 'json') offerDownload(`ssg-data-${d}.json`, exportJSON());
    else offerDownload(`ssg-data-${d}.csv`, exportCSV());
  });
  $('#viewDetail').addEventListener('click', async ev => {
    const b = ev.target.closest('[data-act]'); if(!b) return;
    const it = S.items.find(x => x.id === S.currentId); if(!it) return;
    const menu = b.closest('details'); if(menu) menu.open = false;
    switch(b.dataset.act){
      case 'back': S.view = 'list'; showView(); renderList(); window.scrollTo(0, 0); break;
      case 'edit': openEditor(it.id); break;
      case 'dup': openEditor(it.id, true); break;
      case 'del':
        if(await confirmDialog(`¿Eliminar «${it.titulo || 'Sin título'}»? Esta acción no se puede deshacer.`, 'Eliminar', true)){
          if(await deleteItem(it.id)){ toast('Juego eliminado.'); S.view = 'list'; showView(); renderList(); }
        }
        break;
      case 'ficha': offerDownload(`ficha-${slug(it.titulo)}.html`, fichaHTML(it)); break;
      case 'pdf': exportPDF([it], null); break;
      case 'png':
        if(useImage(it)){ const ext = (it.grafico.imagen.match(/^data:image\/(\w+)/) || [])[1] || 'jpg'; offerDownload(`imagen-${slug(it.titulo)}.${ext === 'jpeg' ? 'jpg' : ext}`, dataUrlToBlob(it.grafico.imagen)); }
        else { try{ offerDownload(`pizarra-${slug(it.titulo)}.png`, await boardPNG(it)); }catch(e){ offerDownload(`pizarra-${slug(it.titulo)}.svg`, `<?xml version="1.0" encoding="UTF-8"?>` + boardSVG(it.grafico, it.espacio).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')); } }
        break;
    }
  });
  document.addEventListener('click', ev => { $$('details.menu[open]').forEach(d => { if(!d.contains(ev.target)) d.open = false; }); });
  document.addEventListener('keydown', ev => {
    if(S.view !== 'edit' || !ed || !$('#modal').hidden) return;
    const typing = ev.target.closest && ev.target.closest('input,textarea,select,[contenteditable]');
    if(typing) return;
    if((ev.key === 'Delete' || ev.key === 'Backspace') && ed.sel >= 0){ ev.preventDefault(); deleteSelected(); }
    else if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z'){ ev.preventDefault(); undo(); }
    else if(ev.key === 'Escape'){ ed.tool = 'sel'; ed.sel = -1; renderTools(); renderEditorBoard(); renderProps(); }
  });
}

async function init(){
  bindStatic();
  renderAll();
  if(caps.inArtifact){
    let db = null, user = null, dl = null;
    try{ [db, user, dl] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]); }catch(e){}
    caps.db = db; caps.user = user; caps.downloads = dl;
    if(db){
      S.mode = 'db';
      if(user){ try{ if((await user.can('data.write')) === false) S.readOnly = true; }catch(e){} }
      subscribe();
    } else startLocal();
  } else startLocal();
  renderAll();
}
init();
</script>
