<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance Assessment 1.0</title>
<meta name="description" content="Valoración del rendimiento físico: perfiles por percentiles a partir de P2 y P98 con distribución normal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: instrument-panel shell — dark step rail on the left, light working canvas; condensed display type for figures */
  --bg:#eef0ec; --surface:#ffffff; --surface-2:#f6f7f4; --surface-3:#eceee9;
  --ink:#141a22; --ink-2:#4b525c; --muted:#6f757e; --line:#dcdfd8; --line-2:#c5c9c1;
  --accent:#0d6b57; --accent-2:#0a5546; --accent-soft:#e1efe9; --on-accent:#ffffff;
  --rail:#141a22; --rail-2:#1d252f; --rail-ink:#eef1ea; --rail-muted:#929aa4; --rail-ok:#5fd3b2;
  --b-vlow:#d03b3b; --b-low:#ee9583; --b-mid:#b3b2aa; --b-high:#6da7ec; --b-vhigh:#1c5cab;
  --b-neu1:#8e8d86; --b-neu2:#c3c2ba; --b-neu3:#e2e1db;
  --danger:#b42318; --warn-bg:#fff3dc; --warn-ink:#7a4a00; --info-bg:#eaf2fb; --info-ink:#1c4f8c;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:10px; --radius-s:6px;
  --shadow:0 1px 2px rgba(20,26,34,.06),0 6px 18px rgba(20,26,34,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1114; --surface:#161a1f; --surface-2:#1b2026; --surface-3:#222830;
    --ink:#edf0ea; --ink-2:#b8beb5; --muted:#8c938a; --line:#2a3037; --line-2:#3a424b;
    --accent:#3fbf9c; --accent-2:#5fd3b2; --accent-soft:#143229; --on-accent:#05211a;
    --rail:#0a0d10; --rail-2:#151a20; --rail-ink:#edf0ea; --rail-muted:#7f8790;
    --b-vlow:#ff7b7b; --b-low:#b45a4e; --b-mid:#6f6e68; --b-high:#3874c4; --b-vhigh:#8fc0ff;
    --b-neu1:#a3a29b; --b-neu2:#6b6a64; --b-neu3:#3b3b37;
    --danger:#ff8a80; --warn-bg:#3a2a0c; --warn-ink:#ffd18a; --info-bg:#112538; --info-ink:#9cc8ff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1114; --surface:#161a1f; --surface-2:#1b2026; --surface-3:#222830;
  --ink:#edf0ea; --ink-2:#b8beb5; --muted:#8c938a; --line:#2a3037; --line-2:#3a424b;
  --accent:#3fbf9c; --accent-2:#5fd3b2; --accent-soft:#143229; --on-accent:#05211a;
  --rail:#0a0d10; --rail-2:#151a20; --rail-ink:#edf0ea; --rail-muted:#7f8790;
  --b-vlow:#ff7b7b; --b-low:#b45a4e; --b-mid:#6f6e68; --b-high:#3874c4; --b-vhigh:#8fc0ff;
  --b-neu1:#a3a29b; --b-neu2:#6b6a64; --b-neu3:#3b3b37;
  --danger:#ff8a80; --warn-bg:#3a2a0c; --warn-ink:#ffd18a; --info-bg:#112538; --info-ink:#9cc8ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100%}
.topbar{grid-column:1 / -1;display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--rail);color:var(--rail-ink);border-bottom:1px solid var(--rail-2);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;flex:none}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand-ver{font-family:var(--font-mono);font-size:11px;margin-left:8px;padding:2px 6px;border:1px solid var(--rail-muted);border-radius:4px;color:var(--rail-muted);vertical-align:3px}
.athlete-chip{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;font-size:13px;color:var(--rail-muted)}
.athlete-chip b{color:var(--rail-ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.athlete-chip .sep{opacity:.5}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);white-space:nowrap}
.tag.soft{background:var(--surface-3);color:var(--ink-2)}
.top-actions{display:flex;gap:8px}
.topbar .btn-ghost{color:var(--rail-ink);border-color:#3a434e}
.topbar .btn-ghost:hover{background:var(--rail-2)}

.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px;position:sticky;top:51px;align-self:start;height:calc(100vh - 51px);overflow:auto;display:flex;flex-direction:column;gap:4px}
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:8px;text-decoration:none;color:inherit;position:relative}
.step:hover{background:var(--rail-2)}
.step.active{background:var(--rail-2)}
.step.active::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--rail-ok)}
.step-n{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1;color:var(--rail-muted);min-width:26px;font-variant-numeric:tabular-nums}
.step.active .step-n{color:var(--rail-ok)}
.step-body{display:flex;flex-direction:column;min-width:0}
.step-name{font-weight:600;font-size:14px;line-height:1.25}
.step-meta{font-size:12px;color:var(--rail-muted);margin-top:2px}
.step-meta.ok{color:var(--rail-ok)}
.rail-sep{height:1px;background:var(--rail-2);margin:8px 8px;flex:none}
.step.lib .step-n{display:flex;align-items:center}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--rail-muted);flex:none}
.save-dot.dirty{background:#f2b33d}
.save-dot.ok{background:var(--rail-ok)}
.lib-list{display:flex;flex-direction:column;gap:16px}
.ath-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.ath-head h2{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.1}
.ath-head .meta{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
table.evals{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px}
table.evals th{text-align:left;font-weight:500;font-size:12px;color:var(--ink-2);padding:6px 8px;border-bottom:1px solid var(--line)}
table.evals td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.evals tr:last-child td{border-bottom:none}
table.evals tr.open td{background:var(--accent-soft)}
table.evals .r{text-align:right}
table.evals td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.evals td.actions{white-space:nowrap;text-align:right}
table.evals td.actions .btn{margin-left:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.rail-foot{margin-top:auto;padding:12px;font-size:11.5px;color:var(--rail-muted);line-height:1.45;border-top:1px solid var(--rail-2)}

.main{padding:26px clamp(16px,3vw,40px) 60px;min-width:0;outline:none}
.view{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.view-head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
.view-head h1{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.01em}
.lede{color:var(--ink-2);max-width:72ch;margin:0}

/* ---------- Cards & layout ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card-title{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:.01em;margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-title small{font-family:var(--font-body);font-size:13px;font-weight:400;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--radius);background:var(--warn-bg);color:var(--warn-ink);border:1px solid color-mix(in srgb,var(--warn-ink) 25%,transparent)}
.banner p{margin:0;flex:1;min-width:240px}
.note{padding:10px 14px;border-radius:var(--radius-s);background:var(--info-bg);color:var(--info-ink);font-size:13.5px}
.note p{margin:0}
.note p+p{margin-top:6px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-ghost{background:transparent}
.btn-s{padding:5px 10px;font-size:13px}
.btn-danger{color:var(--danger)}
.icon-btn{border:none;background:transparent;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:16px;line-height:1}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}
.nav-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:4px}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid .span-2{grid-column:1 / -1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:500;color:var(--ink-2)}
.unit{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-weight:400}
.field small{font-size:12px;color:var(--muted)}
input[type=text],input[type=date],input:not([type]),select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);min-width:0}
input:disabled{background:var(--surface-3);color:var(--ink-2)}
textarea{min-height:84px;resize:vertical}
input[inputmode=decimal],input.time{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;width:fit-content}
.seg label{display:flex;align-items:center;padding:7px 16px;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line-2)}
.seg label:last-child{border-right:none}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--on-accent)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.check input{width:16px;height:16px;accent-color:var(--accent)}

.tomas{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tomas input{width:76px;flex:none;text-align:right}
.agg{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);padding-left:4px;white-space:nowrap}
.agg b{color:var(--ink)}
.series{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.series .cell{display:flex;flex-direction:column;gap:3px}
.series .cell span{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-align:center}
.series input{text-align:right;padding:7px 6px}
.series .pw{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);text-align:center;min-height:16px}
.linked{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:13px;padding:8px 10px;border:1px dashed var(--line-2);border-radius:7px;color:var(--ink-2)}
.linked b{font-family:var(--font-mono);color:var(--ink)}

/* ---------- Test selection ---------- */
.cat-section{display:flex;flex-direction:column;gap:12px}
.cat-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.cat-head h2{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.1}
.cat-head .count{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.cat-head .btn{margin-left:auto}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px;align-items:start}
.test{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.test.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.test.wide{grid-column:1 / -1}
.test-head{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.test-head input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.test-name{font-weight:600;font-size:14.5px;line-height:1.3}
.test-head .unit{margin-left:auto;padding-top:2px;white-space:nowrap}
.test-desc{margin:0;font-size:13px;color:var(--ink-2)}
.test-config{display:flex;flex-direction:column;gap:10px;padding-top:8px;border-top:1px solid var(--line)}
.formula{font-family:var(--font-mono);font-size:12px;line-height:1.55;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.ref{font-size:11.5px;color:var(--muted);margin:0}
.static{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);font-size:14px}
.outs{display:flex;flex-wrap:wrap;gap:6px 14px}
.outs .check{font-size:13px}
.sel-summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.stat b{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1}
.stat span{font-size:13px;color:var(--ink-2)}

/* ---------- Data entry ---------- */
.entry{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0;padding:0;overflow:hidden}
.entry-form{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.entry-head{display:flex;flex-direction:column;gap:2px}
.entry-head h3{font-size:16px;font-weight:600}
.entry-head p{margin:0;font-size:12.5px;color:var(--muted)}
.entry-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:12px 14px}
.entry-fields .wide{grid-column:1 / -1}
.entry-res{background:var(--surface-2);border-left:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.res-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.res-vals{display:flex;flex-direction:column;gap:8px}
.res-item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.res-name{font-size:13px;color:var(--ink-2)}
.res-val{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.res-val.empty{color:var(--line-2)}
.res-unit{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:48px}
.res-notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2);font-family:var(--font-mono)}
.res-missing{margin:0;font-size:12.5px;color:var(--warn-ink);background:var(--warn-bg);padding:6px 9px;border-radius:6px}
.res-warn{margin:0;font-size:12.5px;color:var(--danger)}
.rm-table{width:100%;border-collapse:collapse}
.rm-table th{font-size:12px;font-weight:500;color:var(--ink-2);text-align:left;padding:0 6px 6px 0}
.rm-table td{padding:3px 6px 3px 0;vertical-align:middle}
.rm-table td.n input{width:84px;text-align:right}
.rm-table td.est{font-family:var(--font-mono);font-size:12.5px;white-space:nowrap}

/* ---------- Profile table ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.toolbar .field{min-width:200px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.prof{width:100%;border-collapse:collapse;font-size:13.5px;min-width:1040px}
table.prof th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:500;font-size:12px;color:var(--ink-2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.prof td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.prof tr.cat-row td{background:var(--surface-3);font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:.02em;padding:6px 10px}
table.prof .nm{min-width:180px}
table.prof .nm small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
table.prof td.r,table.prof th.r{text-align:right}
table.prof td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.prof input{width:70px;text-align:right;padding:5px 7px}
table.prof select{width:auto;padding:5px 6px;font-size:12.5px}
table.prof .err{color:var(--danger);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--line-2);background:var(--surface)}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.pill.vlow{color:var(--b-vlow)} .pill.low{color:var(--b-low)} .pill.mid{color:var(--b-mid)} .pill.high{color:var(--b-high)} .pill.vhigh{color:var(--b-vhigh)}
.pill.neu{color:var(--b-neu1)}
.pill span{color:var(--ink)}
.gauge{position:relative;width:120px;height:14px;display:flex;border-radius:3px;overflow:visible}
.gauge i{display:block;height:100%}
.gauge i:first-child{border-radius:3px 0 0 3px}
.gauge i:nth-last-child(2){border-radius:0 3px 3px 0}
.gauge .mk{position:absolute;top:-4px;width:3px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-50%);box-shadow:0 0 0 2px var(--surface)}
.gauge .mk.out::after{content:"";position:absolute;top:6px;border:5px solid transparent}
.method{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.method .formula{font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Dashboard ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h2{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.05}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink-2);font-size:14px;margin-top:6px}

function fatPct(c, model) {
  const m = FAT_MODELS.find(x => x.id === model) || FAT_MODELS[0];
  if (m.id === 'directo') return c.v('grasa_directo');
  const vals = m.sites.map(k => c.v(k));
  const sx = c.sexo;
  const needAge = m.id === 'jp4' || m.id === 'jpw3';
  const age = needAge ? c.edad : null;
  if (vals.some(v => v === null) || !sx || (needAge && age === null)) return null;
  const S = vals.reduce((a, b) => a + b, 0);
  c.note('sum' + m.sites.length, `Σ${m.sites.length} pliegues = ${fmt(S, 1)} mm`);
  const H = sx === 'H';
  switch (m.id) {
    case 'carter': return H ? 0.1051 * S + 2.585 : 0.1548 * S + 3.580;
    case 'yuhasz': return H ? 0.097 * S + 3.64 : 0.143 * S + 4.56;
    case 'faulkner': return H ? 0.153 * S + 5.783 : 0.213 * S + 7.9;
    case 'jp4': return H ? 0.29288 * S - 0.0005 * S * S + 0.15845 * age - 5.76377 : 0.29669 * S - 0.00043 * S * S + 0.02963 * age + 1.4072;

      if (H) { c.w('La ecuación de Jackson, Pollock y Ward (1980) solo es aplicable a mujeres.'); return null; }
      const dc = 1.0994921 - 0.0009929 * S + 0.0000023 * S * S - 0.0001392 * age;
      c.note('dc', `Densidad corporal = ${fmt(dc, 4)} g/cm³`);
      return 495 / dc - 450;
    }
    case 'slaughter': {
      if (isNum(c.age) && (c.age < 8 || c.age >= 19)) c.w('Slaughter et al. (1988) está validada para 8–18 años.');

}

function getSel(state, id) {

  const out = { on: !!s.on, protocol: s.protocol, params: { ...(s.params || {}) }, outputs: { ...(s.outputs || {}) } };
  if (!t) return out;
  if (t.protocols && !t.protocols.some(p => p.id === out.protocol)) out.protocol = t.protocols[0].id;
  for (const pr of t.params || []) { if (!pr.options.some(o => o.id === out.params[pr.id])) out.params[pr.id] = pr.def || pr.options[0].id; }
  for (const o of t.outputs || []) if (out.outputs[o.id] === undefined) out.outputs[o.id] = o.off ? false : true;
  return out;
}

function vo2Calc(c, depth = 0) {
  const sel = getSel(c.state, 'vo2');
  switch (sel.protocol) {
    case 'directo': return c.v('vo2_directo');
    case 'navette': {
      const n = c.v('navette_periodo'); if (n === null) return null;
      const V = 8 + 0.5 * n; c.note('vnav', `Velocidad final = ${fmt(V, 1)} km/h`);
      if (sel.params.modelo === 'stclair') return 6.0 * V - 24.4;
      const e = c.edad; if (e === null) return null;
      const E = Math.min(e, 18); if (e > 18) c.note('e18', 'Adulto: se aplica edad = 18 (Léger et al., 1988)');
      return 31.025 + 3.238 * V - 3.248 * E + 0.1536 * V * E;
    }
    case 'cooper': { const d = c.v('cooper_dist'); return d === null ? null : (d - 504.9) / 44.73; }
    case 'yoyo1': { const d = c.v('yoyo_dist'); return d === null ? null : d * 0.0084 + 36.4; }
    case 'yoyo2': { const d = c.v('yoyo_dist'); return d === null ? null : d * 0.0136 + 45.3; }
    case 'ift': {
      const v = c.v('ift_vift'), P = c.v('peso'), e = c.edad, sx = c.sexo;
      if ([v, P, e].some(x => x === null) || !sx) return null;
      const G = sx === 'H' ? 1 : 2;
      return 28.3 - 2.15 * G - 0.741 * e - 0.0357 * P + 0.0586 * e * v + 1.03 * v;
    }
    case 'george': {
      const t = c.v('george_t'), fc = c.v('george_fc'), P = c.v('peso'), sx = c.sexo;
      if ([t, fc, P].some(x => x === null) || !sx) return null;
      const tm = t / 60; c.note('t', `Tiempo = ${fmt(tm, 2)} min`);
      if ((sx === 'H' && tm < 8) || (sx === 'M' && tm < 9)) c.w('Para que el esfuerzo sea submáximo, el tiempo debe ser ≥ 8 min en hombres y ≥ 9 min en mujeres (George et al., 1993).');
      if (fc > 180) c.w('La FC al finalizar debe ser ≤ 180 lpm (George et al., 1993).');
      return 100.5 + 8.344 * (sx === 'H' ? 1 : 0) - 0.1636 * P - 1.438 * tm - 0.1928 * fc;
    }
    case 'mcardle': {
      const fc = c.v('mcardle_fc'), sx = c.sexo; if (fc === null || !sx) return null;
      c.note('cad', `Cadencia aplicada: ${sx === 'H' ? '24 subidas/min (metrónomo 96)' : '22 subidas/min (metrónomo 88)'}`);
      return sx === 'H' ? 111.33 - 0.42 * fc : 65.81 - 0.1847 * fc;
    }
    case 'rockport': {
      const t = c.v('rockport_t'), fc = c.v('rockport_fc'), P = c.v('peso'), e = c.edad, sx = c.sexo;
      if ([t, fc, P, e].some(x => x === null) || !sx) return null;
      const tm = t / 60, lb = P * 2.20462; c.note('lb', `Tiempo = ${fmt(tm, 2)} min · peso = ${fmt(lb, 1)} lb`);
      if (isNum(c.age) && (c.age < 30 || c.age >= 70)) c.w('La ecuación de Rockport se desarrolló en adultos de 30 a 69 años.');
      return 132.853 - 0.0769 * lb - 0.3877 * e + 6.315 * (sx === 'H' ? 1 : 0) - 3.2649 * tm - 0.1565 * fc;
    }
    case 'vam': {
      if (depth > 0) { c.w('Referencia circular: VO2max y VAM se estiman la una desde la otra.'); return null; }
      const vam = vamCalc(c, depth + 1); if (vam === null) { c.w('Completa la prueba de VAM (otro protocolo) para estimar el VO2max.'); return null; }
      c.note('vamref', `VAM utilizada = ${fmt(vam, 2)} km/h`); return 3.5 * vam;
    }
  }
  return null;
}
function vamCalc(c, depth = 0) {
  const sel = getSel(c.state, 'vam');
  const kuip = sel.params.calc === 'kuipers';
  switch (sel.protocol) {
    case 'directo': return c.v('vam_directo');
    case 'vameval': { const v = c.v('vameval_vel'); if (v === null) return null; const s = c.o('vameval_seg'); return kuip && isNum(s) ? v + 0.5 * clamp(s, 0, 60) / 60 : v; }
    case 'umtt': { const v = c.v('umtt_vel'); if (v === null) return null; const s = c.o('umtt_seg'); return kuip && isNum(s) ? v + 1 * clamp(s, 0, 120) / 120 : v; }
    case 't5': { const d = c.v('t5_dist'); return d === null ? null : d * 0.012; }
    case 't6': { const d = c.v('t6_dist'); return d === null ? null : d / 100; }
    case 'tmax': {
      const d = c.v('tmax_dist'), t = c.v('tmax_t'); if (d === null || t === null || t <= 0) return null;
      if (t < 300 || t > 480) c.w('La duración del esfuerzo debe estar entre 5 y 8 min.');

    }
    case 'vo2': {
      if (depth > 0) { c.w('Referencia circular: VO2max y VAM se estiman la una desde la otra.'); return null; }
      const vo2 = vo2Calc(c, depth + 1); if (vo2 === null) { c.w('Completa la prueba de VO2max (otro protocolo) para estimar la VAM.'); return null; }
      c.note('vo2ref', `VO2max utilizado = ${fmt(vo2, 1)} ml/kg/min`); return vo2 / 3.5;
    }
  }
  return null;
}

  { id: 'lombardi', name: 'Lombardi (1989)', formula: '1RM = carga · reps^0,10', ref: 'lombardi89', f: (w, r) => w * Math.pow(r, 0.10) },

  { id: 'wathan', name: 'Wathan (1994)', formula: '1RM = 100 · carga / (48,8 + 53,8 · e^(−0,075 · reps))', ref: 'wathan94', f: (w, r) => 100 * w / (48.8 + 53.8 * Math.exp(-0.075 * r)) },
  { id: 'media', name: 'Media de las 7 ecuaciones', formula: '1RM = media(Brzycki, Epley, Lander, Lombardi, Mayhew, O’Conner, Wathan)' },

function rmEstimate(w, r, eq) {
  if (!isNum(w) || !isNum(r) || r < 1) return null;

  if (r === 1) return w;

function rmRows(state) { const sel = getSel(state, 'rm'), suf = rmSuffix(sel); const rows = Array.isArray(state.datos.rm) ? state.datos.rm : []; const seen = {}; return rows.map(r => { let id = 'rm_' + slug(r.ejercicio || 'ejercicio'); seen[id] = (seen[id] || 0) + 1; if (seen[id] > 1) id += '_' + seen[id]; return { ...r, indId: id + suf }; }); }

function rmFit(w1, r1, w2, r2, model) {

  if (r1 === r2) return { err: 'las dos series deben tener distinto número de repeticiones.' };

  if (!(w1 > w2)) return { err: 'la carga de la serie con menos repeticiones debe ser mayor que la otra.' };

  return { model: 'lineal', f: n => a - b * n, oneRM: a - b, b, pts };
}

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const _writeDraft = debounce(() => store.set(LS_DRAFT, state), 350);
function saveDraft() { state.meta.modificado = new Date().toISOString(); _writeDraft(); }
function barLib() { const v = store.get(LS_BAR); return Array.isArray(v) ? v : []; }
function setBarLib(v) { store.set(LS_BAR, v); }

function gaugeHTML(prof) {
  if (!prof || !(isNum(prof.mu))) return '<span class="muted">—</span>';
  const segs = [[-3, -Z98], [-Z98, -Z84], [-Z84, Z84], [Z84, Z98], [Z98, 3]];

/* ---------- paso 2: selección de pruebas ---------- */
function testUnit(t, sel) { if (t.dynamic) return sel.params.expr === 'rel' ? 'kg/kg' : 'kg'; if (t.outputs.length === 1) { const u = t.outputs[0].unit; return typeof u === 'function' ? u(sel) : u; } return t.unit; }
function testCard(t) {
  const sel = getSel(state, t.id), on = sel.on;
  let cfg = '';
  if (on) {
    const prot = t.protocols.find(p => p.id === sel.protocol);
    cfg += `<div class="field"><label for="pr_${t.id}">Protocolo</label>${t.protocols.length > 1 ? `<select id="pr_${t.id}" data-act="sel-protocol" data-test="${t.id}">${t.protocols.map(p => `<option value="${p.id}" ${p.id === sel.protocol ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>` : `<div class="static">${esc(prot.name)}</div>`}<small>${esc(prot.desc || '')}${prot.ref ? ` (${esc(refShort(prot.ref))})` : ''}</small></div>`;
    for (const p of visibleParams(t, sel)) {
      if (p.id === 'eq') { const e = t.eqText && t.eqText(sel); if (e) cfg += `<div class="field"><span class="flabel">Ecuación</span><div class="formula">${esc(e[0])}</div>${e[1] ? `<p class="ref">${esc(refShort(e[1]))}</p>` : ''}</div>`; continue; }
      const o = p.options.find(x => x.id === sel.params[p.id]);
      if (p.options.length === 1) { const trivial = !o.formula || /^Valor introducido$/.test(o.formula); cfg += `<div class="field"><span class="flabel">${esc(p.label)}: <b style="color:var(--ink)">${esc(o.name)}</b></span>${trivial ? '' : `<div class="formula">${esc(o.formula)}</div>`}${o.ref && o.ref !== prot.ref ? `<p class="ref">${esc(refShort(o.ref))}</p>` : ''}</div>`; continue; }
      cfg += `<div class="field"><label for="pa_${t.id}_${p.id}">${esc(p.label)}</label>${p.options.length > 1 ? `<select id="pa_${t.id}_${p.id}" data-act="sel-param" data-test="${t.id}" data-param="${p.id}">${p.options.map(x => `<option value="${x.id}" ${x.id === sel.params[p.id] ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : `<div class="static">${esc(o ? o.name : '')}</div>`}${o && o.formula ? `<div class="formula">${esc(o.formula)}</div>` : ''}${o && o.ref ? `<p class="ref">${esc(refShort(o.ref))}</p>` : ''}</div>`;
    }
    if (!t.dynamic && t.outputs.length > 1) cfg += `<div class="field"><span class="flabel">Indicadores que pasan al perfil</span><div class="outs">${t.outputs.map(o => `<label class="check"><input type="checkbox" data-act="sel-output" data-test="${t.id}" data-out="${o.id}" ${sel.outputs[o.id] ? 'checked' : ''}> ${esc(o.short || o.name)}</label>`).join('')}</div></div>`;
    if (t.dynamic) cfg += `<p class="ref">Cada ejercicio que añadas en el paso 3 genera un indicador propio.</p>`;
  }
  return `<article class="test ${on ? 'on' : ''}" data-card="${t.id}"><label class="test-head"><input type="checkbox" data-act="toggle-test" data-test="${t.id}" ${on ? 'checked' : ''}><span class="test-name">${esc(t.name)}${t.extra ? ' <span class="tag soft">Complementario</span>' : ''}</span><span class="unit">${esc(testUnit(t, sel))}</span></label><p class="test-desc">${esc(t.desc)}</p>${on ? `<div class="test-config">${cfg}</div>` : ''}</article>`;
}

  const row = i => `<li><span class="fd-name">${esc(i.name)}<small>${esc(catById(i.cat).short)} · ${esc(bandLabel(i.prof))}</small></span><span class="fd-val">${fmt(i.value, i.dec)} <span class="unit">${esc(i.unit)}</span></span><span class="fd-p">P${fmtPct(i.prof.pr)}</span></li>`;
  const card = (k, title, crit, list, empty) => `<section class="card fd-card ${k}"><h2 class="card-title"><span class="fd-ico">${FD_ICON[k]}</span>${title} <small>${crit} · ${list.length}</small></h2>${list.length ? `<ul class="fd-list">${list.map(row).join('')}</ul>` : `<p class="muted">${empty}</p>`}</section>`;
  const cut = fdCuts(), F = fmtTrim(cut.fort, 1), D = fmtTrim(cut.deb, 1);
  return `<div class="grid-2 fd${compact ? ' compact' : ''}">${card('fort', 'Fortalezas', `percentil de rendimiento > P${F}`, f, `Ningún indicador supera el percentil ${F}.`)}${card('deb', 'Debilidades', `percentil de rendimiento < P${D}`, d, `Ningún indicador queda por debajo del percentil ${D}.`)}</div><p class="ref">No se clasifican los indicadores descriptivos ni los que tienen un aviso de salud. En los indicadores en los que «menor es mejor» se usa el percentil invertido. Los percentiles de corte se cambian en <a href="#registro">Introducción de datos</a>.</p>`;
}
function rmFitsAll(s = state) { const sel = getSel(s, 'rm'); if (!sel.on || sel.protocol !== 'dos') return []; return (s.datos.rm || []).map(r => ({ r, fit: rmRowFit(r, sel) })).filter(x => x.fit && !x.fit.err); }
function curveCard(i) {
  const pr = i.prof;
  return `<div class="curve${i.alert ? ' has-alert' : ''}"><div class="curve-head"><h4>${esc(i.name)}</h4><span class="v">${fmt(i.value, i.dec)} ${esc(i.unit)}</span></div>${curveSVG(i)}${i.alert ? `<p class="res-alert">${esc(i.alert)}</p>` : ''}<div class="curve-foot"><span class="row" style="gap:6px">${pill(pr)}${fdTag(i)}</span><span class="num">P${fmtPct(pr.sentido === 'neutro' ? pr.pct : pr.pr)}${pr.sentido === 'menor' ? ' <span class="muted">(invertido)</span>' : ''}</span></div></div>`;
}
function curveSVG(i) {
  const pr = i.prof, W = 280, H = 104, pad = 12, top = 8, base = 66;
  const X = z => pad + (z + 3.2) / 6.4 * (W - 2 * pad);
  const Y = z => base - Math.exp(-z * z / 2) * (base - top);
  let d = ''; for (let k = 0; k <= 96; k++) { const z = -3.2 + 6.4 * k / 96; d += (k ? 'L' : 'M') + X(z).toFixed(1) + ' ' + Y(z).toFixed(1); }
  const area = (a, b) => { let s = `M${X(a).toFixed(1)} ${base}`; for (let k = 0; k <= 20; k++) { const z = a + (b - a) * k / 20; s += `L${X(z).toFixed(1)} ${Y(z).toFixed(1)}`; } return s + `L${X(b).toFixed(1)} ${base}Z`; };
  const segs = [[-3.2, -Z98], [-Z98, -Z84], [-Z84, Z84], [Z84, Z98], [Z98, 3.2]];
  let cols;
  if (pr.sentido === 'neutro') cols = ['--b-neu2', '--b-neu3', '--surface-3', '--b-neu3', '--b-neu2'];
  else cols = (pr.sentido === 'menor' ? ['vhigh', 'high', 'mid', 'low', 'vlow'] : ['vlow', 'low', 'mid', 'high', 'vhigh']).map(x => '--b-' + x);
  const zc = clamp(pr.z, -3.2, 3.2), xm = X(zc), out = Math.abs(pr.z) > 3.2;
  const dd = Math.max(i.dec, 0);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(i.name)}: z ${fmt(pr.z, 2)}">
  ${segs.map(([a, b], k) => `<path d="${area(a, b)}" style="fill:var(${cols[k]})" fill-opacity="${pr.sentido === 'neutro' ? 1 : 0.55}"/>`).join('')}
  <path d="${d}" fill="none" style="stroke:var(--ink-2)" stroke-width="1.5"/>
  <line x1="${pad}" x2="${W - pad}" y1="${base}" y2="${base}" style="stroke:var(--line-2)"/>
  ${[-Z98, 0, Z98].map(z => `<line x1="${X(z).toFixed(1)}" x2="${X(z).toFixed(1)}" y1="${base}" y2="${base + 4}" style="stroke:var(--muted)"/>`).join('')}
  <text x="${X(-Z98).toFixed(1)}" y="${base + 15}" text-anchor="middle" font-size="10" style="fill:var(--ink-2);font-family:var(--font-mono)">${fmt(pr.p2, dd)}</text>
  <text x="${X(0).toFixed(1)}" y="${base + 15}" text-anchor="middle" font-size="10" style="fill:var(--ink-2);font-family:var(--font-mono)">${fmt(pr.mu, dd)}</text>
  <text x="${X(Z98).toFixed(1)}" y="${base + 15}" text-anchor="middle" font-size="10" style="fill:var(--ink-2);font-family:var(--font-mono)">${fmt(pr.p98, dd)}</text>
  <text x="${X(-Z98).toFixed(1)}" y="${base + 27}" text-anchor="middle" font-size="9" style="fill:var(--muted)">P2</text>
  <text x="${X(0).toFixed(1)}" y="${base + 27}" text-anchor="middle" font-size="9" style="fill:var(--muted)">P50</text>
  <text x="${X(Z98).toFixed(1)}" y="${base + 27}" text-anchor="middle" font-size="9" style="fill:var(--muted)">P98</text>
  <line x1="${xm.toFixed(1)}" x2="${xm.toFixed(1)}" y1="${top - 2}" y2="${base}" style="stroke:var(--ink)" stroke-width="2"/>
  <circle cx="${xm.toFixed(1)}" cy="${Y(zc).toFixed(1)}" r="4.5" style="fill:var(--ink);stroke:var(--surface)" stroke-width="2"/>
  ${out ? `<text x="${(xm + (pr.z > 0 ? -6 : 6)).toFixed(1)}" y="${top + 8}" text-anchor="${pr.z > 0 ? 'end' : 'start'}" font-size="9.5" style="fill:var(--ink)">fuera de escala</text>` : ''}
  </svg>`;
}

/* =====================================================================
   Archivo local de deportistas y evaluaciones (localStorage)
   ===================================================================== */
const LS_EVALS = 'pa1.evaluaciones';
let libQuery = '', _pending = null;
function evalLib() { const v = store.get(LS_EVALS); return Array.isArray(v) ? v.filter(r => r && r.id && r.state) : []; }
function setEvalLib(v) { return store.set(LS_EVALS, v); }
function libSizeKB() { try { return Math.max(1, Math.round((localStorage.getItem(LS_EVALS) || '').length / 1024)); } catch (e) { return 0; } }

function hasContent(s = state) {
  if ((s.persona.nombre || '').trim()) return true;
  return Object.entries(s.datos).some(([k, v]) => k === 'rm' ? (v || []).some(r => String(r.carga || '').trim() || String(r.carga2 || '').trim()) : Array.isArray(v) ? v.some(x => String(x ?? '').trim()) : String(v ?? '').trim());
}
function isDirty() {
  const m = state.meta;
  if (!hasContent()) return false;
  if (m.demo && !m.guardado && !m.modificado) return false;
  if (!m.guardado) return true;
  return !!(m.modificado && m.modificado > m.guardado);
}
function resumenOf(s, R) {
  const p = s.persona, gi = globalIndex(R.list);
  return { nombre: p.nombre, sexo: p.sexo, fechaNac: p.fechaNac, edad: ageYears(p), rango: p.rangoEdad, modalidad: p.modalidad, especialidad: p.especialidad, club: p.club, fechaEval: p.fechaEval, indice: gi, nInd: R.list.length, nPerf: R.list.filter(i => i.prof.ok).length, demo: !!s.meta.demo };
}
const athleteKey = r => slug(r.resumen?.nombre || r.state?.persona?.nombre || '') + '|' + (r.resumen?.fechaNac || r.state?.persona?.fechaNac || '');

function saveEvaluation() {
  if (!(state.persona.nombre || '').trim()) { closeDialog(); toast('Escribe el nombre del deportista antes de guardar.', 4500); location.hash = '#datos'; go('datos'); setTimeout(() => { const n = $('#in_persona_nombre'); n && n.focus(); }, 50); return false; }
  recompute();
  const lib = evalLib(), now = new Date().toISOString();
  if (!state.meta.id) state.meta.id = 'ev_' + Date.now().toString(36) + uid();
  const prevG = state.meta.guardado; state.meta.guardado = now;
  const rec = { id: state.meta.id, guardado: now, resumen: resumenOf(state, RES), state: clone(state) };
  const k = lib.findIndex(r => r.id === rec.id); const isNew = k < 0;
  if (isNew) lib.push(rec); else lib[k] = rec;
  if (!setEvalLib(lib)) { state.meta.guardado = prevG; toast('No hay espacio suficiente en el navegador. Exporta una copia de seguridad y elimina evaluaciones antiguas.', 7000); return false; }
  store.set(LS_DRAFT, state);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) { /* noop */ }
  renderChrome();
  if (cur === 'deportistas') render();
  toast(`${isNew ? 'Evaluación guardada' : 'Evaluación actualizada'} en este navegador: ${state.persona.nombre}`);
  return true;
}
function loadState(s, to) {
  state = normalizeState(clone(s)); recompute(); store.set(LS_DRAFT, state);
  location.hash = '#' + to; go(to);
}
function openRecord(id) {
  const rec = evalLib().find(r => r.id === id); if (!rec) { toast('No se encontró la evaluación.'); return; }

function newForAthlete(id) {
  const rec = evalLib().find(r => r.id === id); if (!rec) return;
  const src = normalizeState(rec.state), ns = blankState();
  ns.persona = { ...clone(src.persona), fechaEval: today(), observaciones: '' };
  ns.seleccion = clone(src.seleccion); ns.baremos = clone(src.baremos); ns.criterios = clone(src.criterios || ns.criterios);

  ns.informe.anexo = src.informe.anexo; ns.informe.radar = src.informe.radar;

function deleteRecord(id) {
  const lib = evalLib(), k = lib.findIndex(r => r.id === id); if (k < 0) return;
  const [rec] = lib.splice(k, 1); setEvalLib(lib);
  if (state.meta.id === id) { state.meta.id = null; state.meta.guardado = null; store.set(LS_DRAFT, state); }

/* Si hay cambios sin guardar, pregunta antes de cambiar de evaluación */
function guard(fn) {
  if (!isDirty()) { fn(); return; }
  _pending = fn;
  openDialog(`<h2>Cambios sin guardar</h2><p>La evaluación abierta (${esc(state.persona.nombre || 'sin nombre')}) tiene cambios que no están guardados en el navegador.</p>

function importArchive(j) {
  const inc = Array.isArray(j.evaluaciones) ? j.evaluaciones.filter(r => r && r.id && r.state) : [];
  const lib = evalLib(); let add = 0, upd = 0;
  inc.forEach(r => { if (!r.resumen) r.resumen = resumenOf(normalizeState(r.state), compute(normalizeState(r.state))); const k = lib.findIndex(x => x.id === r.id); if (k < 0) { lib.push(r); add++; } else if ((r.guardado || '') > (lib[k].guardado || '')) { lib[k] = r; upd++; } });
  if (!setEvalLib(lib)) { toast('No hay espacio suficiente en el navegador para importar la copia.', 6000); return; }
  let nb = 0;
  if (Array.isArray(j.baremos)) { const bl = barLib(); j.baremos.forEach(b => { if (b && b.nombre && b.valores && !bl.some(x => x.nombre === b.nombre && x.creado === b.creado)) { bl.push(b); nb++; } }); setBarLib(bl); }
  render(); toast(`Copia importada: ${add} evaluaciones nuevas, ${upd} actualizadas${nb ? `, ${nb} baremos` : ''}.`, 5000);
}

function libGroups() {
  const norm = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const q = norm(libQuery).trim();
  const groups = new Map();
  evalLib().forEach(r => { const k = athleteKey(r); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
  let arr = [...groups.values()].map(list => list.sort((a, b) => (b.resumen.fechaEval || '').localeCompare(a.resumen.fechaEval || '') || (b.guardado || '').localeCompare(a.guardado || '')));
  if (q) arr = arr.filter(list => list.some(r => { const x = r.resumen; return norm([x.nombre, x.modalidad, x.especialidad, x.club, x.rango].join(' ')).includes(q); }));
  return arr.sort((a, b) => (a[0].resumen.nombre || '').localeCompare(b[0].resumen.nombre || '', 'es'));
}

/* ---------- importación ---------- */
async function importFile(file) {
  if (!file) return;
  try {
    const name = file.name.toLowerCase(); let s = null, label = '';
    if (name.endsWith('.pdf') || file.type === 'application/pdf') {
      const buf = await file.arrayBuffer(); const txt = new TextDecoder('latin1').decode(new Uint8Array(buf));
      const m = txt.match(/PA1JSON:([A-Za-z0-9+/=]+):PA1END/);
      if (!m) throw new Error('Este PDF no contiene datos de Performance Assessment.');
      s = JSON.parse(unb64utf8(m[1])).state;
    } else {
      const txt = await file.text();
      if (name.endsWith('.csv') || /^﻿?#Performance Assessment/.test(txt)) s = stateFromCSV(txt);
      else {
        const j = JSON.parse(txt);
        if (j.type === 'pa1-baremos') { importBarLib(j); return; }
        if (j.type === 'pa1-archivo') { importArchive(j); return; }
        s = j.state || (j.persona ? j : null);
        if (!s) throw new Error('El JSON no corresponde a una evaluación de Performance Assessment.');
      }
    }
    guard(() => { state = normalizeState(s); state.meta.guardado = null; state.meta.modificado = new Date().toISOString(); recompute(); store.set(LS_DRAFT, state); render(); toast('Evaluación importada: ' + (state.persona.nombre || 'sin nombre') + '. Pulsa «Guardar» para añadirla al archivo del navegador.', 5000); });
  } catch (e) { toast('No se pudo importar: ' + e.message, 6000); }
}
function importBarLib(j) {
  const items = Array.isArray(j.baremos) ? j.baremos : [];
  if (!items.length) { toast('El archivo no contiene baremos.'); return; }
  setBarLib([...barLib(), ...items.filter(b => b && b.nombre && b.valores)]); toast(`${items.length} baremos añadidos a la biblioteca`); render();
}
function applyBaremo(b) {
  if (!b || !b.valores) return;
  Object.entries(b.valores).forEach(([id, v]) => { state.baremos[id] = { ...v }; });
  changed(); render(); toast('Baremo aplicado: ' + b.nombre);
}

  if (act === 'sel-output') sel.outputs[el.dataset.out] = el.checked;
  state.seleccion[id] = { ...cur0, ...sel };
  changed();
  const card = $(`[data-card="${id}"]`); if (card) card.outerHTML = testCard(TEST_BY_ID[id]);
  if (id === 'grasa' && $('[data-card="magro"]')) $('[data-card="magro"]').outerHTML = testCard(TEST_BY_ID.magro);
  refreshSelCounts(); renderChrome();
  const nc = $(`[data-card="${id}"] [data-act="${act}"]${el.dataset.param ? `[data-param="${el.dataset.param}"]` : ''}${el.dataset.out ? `[data-out="${el.dataset.out}"]` : ''}`); if (nc) nc.focus();
});
function refreshSelCounts() {

}
function setTests(ids, on) { ids.forEach(id => { const s = getSel(state, id); s.on = on; state.seleccion[id] = { ...(state.seleccion[id] || {}), ...s }; }); if (on && ids.includes('rm') && !(state.datos.rm || []).length) state.datos.rm = [{ id: uid(), ejercicio: '', carga: '', reps: '12' }]; changed(); render(); }
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  const act = el.dataset.act;

    case 'lib-delete': { const r = evalLib().find(x => x.id === el.dataset.id); if (!r) break; openDialog(`<h2>Eliminar evaluación</h2><p>Se eliminará del navegador la evaluación de <b>${esc(r.resumen.nombre || 'sin nombre')}</b> del ${esc(fechaES(r.resumen.fechaEval))}. No se puede deshacer.</p><div class="actions"><button class="btn" type="button" data-act="dlg-close" autofocus>Cancelar</button><button class="btn btn-primary" type="button" data-act="dlg-del-confirm" data-id="${esc(r.id)}">Eliminar</button></div>`); break; }

    case 'sel-all': setTests(TESTS.map(t => t.id), true); break;

    case 'cat-toggle': { const ts = TESTS.filter(t => t.cat === el.dataset.cat).map(t => t.id); setTests(ts, !ts.every(id => getSel(state, id).on)); break; }

    case 'lib-export': await saveFile('baremos_performance_assessment.json', JSON.stringify({ type: 'pa1-baremos', version: APP.version, exportado: new Date().toISOString(), baremos: barLib() }, null, 2), 'application/json'); break;
    case 'dash-filter': dashFilter = el.dataset.cat; render(); break;
    case 'exp-json': await saveFile(fileBase() + '.json', JSON.stringify(exportPayload(), null, 2), 'application/json'); break;
    case 'exp-csv': await saveFile(fileBase() + '.csv', toCSV(), 'text/csv'); break;

  }
});
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); if ($('#overlay').hidden) saveEvaluation(); return; } if (e.key === 'Escape' && !$('#overlay').hidden) closeDialog(); if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'dropZone') { e.preventDefault(); $('#fileImport').click(); } });
